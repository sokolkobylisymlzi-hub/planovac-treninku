<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>KOby Coach · mobil</title>
  <meta name="apple-mobile-web-app-title" content="KOby Coach" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --border:   #334155;
      --muted:    #64748b;
      --text:     #f1f5f9;
      --text2:    #94a3b8;
      --blue:     #3b82f6;
      --blue-d:   #1d4ed8;
      --red:      #ef4444;
      --amber:    #f59e0b;
      --emerald:  #10b981;
      --radius:   14px;
      --radius-s: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Layout ──────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100dvh; }

    header {
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
    header p  { font-size: 11px; color: var(--text2); margin-top: 1px; }
    header .spacer { flex: 1; }

    #section-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .section-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: var(--radius-s);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      background: var(--surface);
      color: var(--text2);
      transition: background .15s, color .15s;
    }
    .section-btn.active {
      background: var(--blue);
      color: #fff;
    }

    #main { flex: 1; overflow-y: auto; padding: 12px 16px 80px; }

    /* ── Metainformace tréninku ───────────────────────────────── */
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .meta-grid label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 3px; }
    .meta-grid input, .meta-grid select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      color: var(--text);
      font-size: 14px;
      padding: 8px 10px;
    }
    .meta-grid input:focus, .meta-grid select:focus {
      outline: none;
      border-color: var(--blue);
    }

    /* ── Bloky ───────────────────────────────────────────────── */
    .block {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #263346;
      border-bottom: 1px solid var(--border);
    }
    .block-time {
      font-family: monospace;
      font-size: 12px;
      color: #93c5fd;
      flex-shrink: 0;
    }
    .block-name-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--border);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      padding: 2px 4px;
      min-width: 0;
    }
    .block-name-input:focus { outline: none; border-color: var(--blue); }
    .block-dur {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text2);
      flex-shrink: 0;
    }
    .block-dur input {
      width: 46px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: monospace;
      text-align: center;
      padding: 3px 4px;
    }
    .block-dur input:focus { outline: none; border-color: var(--blue); }
    .block-actions { display: flex; gap: 2px; }
    .icon-btn {
      width: 30px; height: 30px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: background .15s, color .15s;
    }
    .icon-btn:active { background: var(--border); }
    .icon-btn.del:active { color: var(--red); }

    .block-body { padding: 10px 12px; }

    /* ── Cvičení v bloku ─────────────────────────────────────── */
    .drill-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: var(--radius-s);
      padding: 10px;
      margin-bottom: 8px;
    }
    .drill-item-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .drill-item-info { flex: 1; min-width: 0; }
    .drill-item-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      line-height: 1.3;
    }
    .drill-item-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drill-item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .drill-item-controls input {
      width: 46px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: monospace;
      text-align: center;
      padding: 4px;
    }
    .drill-item-controls input:focus { outline: none; border-color: var(--blue); }
    .drill-item-controls span { font-size: 11px; color: var(--text2); }
    .drill-detail {
      margin-top: 8px;
      padding: 8px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.5;
    }
    .drill-detail strong { color: var(--text); }
    .drill-detail .tag { color: #86efac; }
    .drill-detail .tag-warn { color: #fca5a5; }
    .drill-detail .tag-info { color: #93c5fd; }
    .drill-note {
      margin-top: 6px;
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 6px 8px;
      resize: none;
      min-height: 34px;
    }
    .drill-note:focus { outline: none; border-color: var(--blue); }

    /* ── Hledání do bloku ────────────────────────────────────── */
    .search-box {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: var(--radius-s);
      padding: 10px 12px;
      margin-top: 8px;
    }
    .search-label {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-input-wrap { position: relative; }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 36px 10px 12px;
    }
    .search-input:focus { outline: none; border-color: var(--blue); }
    .search-clear {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .search-hint { font-size: 11px; color: var(--text2); margin-top: 5px; }
    .search-results {
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      overflow: hidden;
    }
    .result-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .result-item:last-child { border-bottom: none; }
    .result-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
    }
    .result-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }
    .result-btns {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    /* ── Tlačítka ────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .btn:active { opacity: .75; }
    .btn-blue    { background: var(--blue);    color: #fff; }
    .btn-surface { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-red     { background: #450a0a;        color: #fca5a5; border: 1px solid #7f1d1d; }
    .btn-sm { padding: 5px 10px; font-size: 11px; }

    /* ── FAB ─────────────────────────────────────────────────── */
    #fab-area {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px 16px 14px;
      background: linear-gradient(transparent, var(--bg) 40%);
      display: flex;
      gap: 8px;
    }
    #fab-add {
      flex: 1;
      padding: 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text2);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color .15s, color .15s;
    }
    #fab-add:active { border-color: var(--blue); color: var(--text); }

    /* ── Celkový přehled ─────────────────────────────────────── */
    .summary-bar {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .summary-stat { text-align: center; }
    .summary-num  { font-size: 20px; font-weight: 900; font-family: monospace; color: #93c5fd; }
    .summary-lbl  { font-size: 10px; color: var(--text2); }

    /* ── Prázdný stav ────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 40px 16px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h2 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
    .empty-state p  { font-size: 13px; color: var(--text2); }

    /* ── Loading ─────────────────────────────────────────────── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      height: 200px;
      color: var(--text2);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Detailní výtažek cvičení ─────────────────────────────── */
    .drill-desc-section { margin-top: 5px; }
    .drill-desc-section + .drill-desc-section { margin-top: 8px; }
    .drill-desc-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
    .drill-desc-list { padding-left: 14px; }
    .drill-desc-list li { margin-bottom: 2px; }

    /* ── Osobní značky (oblíbené, štítky) ────────────────────── */
    .star-btn {
      width: 30px; height: 30px; border: none; background: transparent;
      font-size: 18px; cursor: pointer; color: #475569; flex-shrink: 0; line-height: 1;
    }
    .star-btn.on { color: #fbbf24; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: #312e81; color: #c7d2fe; border: 1px solid #4338ca; cursor: pointer;
    }
    .chip.filter { background: var(--surface); color: var(--text2); border-color: var(--border); }
    .chip.filter.on { background: #4338ca; color: #fff; border-color: #6366f1; }
    .chip.fav.on { background: #78350f; color: #fde68a; border-color: #b45309; }
    .chip .x { opacity: .7; font-size: 12px; }
    .tag-editor { margin-top: 6px; display: flex; gap: 6px; }
    .tag-editor input {
      flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 13px; padding: 6px 8px;
    }
    .tag-editor input:focus { outline: none; border-color: var(--blue); }
    .my-note-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #fbbf24; margin-top: 8px; letter-spacing: .05em; }

    /* ── Menu ────────────────────────────────────────────────── */
    #menu-overlay {
      position: fixed; inset: 0; background: rgba(2,6,23,.6); z-index: 50; display: none;
    }
    #menu-overlay.show { display: block; }
    #menu {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; padding: 16px 16px 24px;
    }
    #menu h3 { font-size: 14px; margin-bottom: 4px; }
    #menu .menu-sub { font-size: 11px; color: var(--text2); margin-bottom: 12px; }
    .menu-item {
      display: block; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 8px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .menu-item small { display: block; font-weight: 400; font-size: 11px; color: var(--text2); margin-top: 2px; }
    .menu-item:active { border-color: var(--blue); }

    /* ── Uložené tréninky ────────────────────────────────────── */
    .training-bar {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; margin-bottom: 12px;
    }
    .training-name {
      width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--border);
      color: var(--text); font-size: 16px; font-weight: 800; padding: 3px 2px;
    }
    .training-name:focus { outline: none; border-color: var(--blue); }
    .training-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .training-row input[type=date] {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 13px; padding: 5px 8px; color-scheme: dark;
    }
    .save-state { flex: 1; font-size: 11px; color: var(--text2); min-width: 80px; }
    .save-state.ok { color: #6ee7b7; }
    .lib-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .lib-item.current { border-color: var(--blue); }
    .lib-title { font-weight: 700; font-size: 14px; }
    .lib-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .lib-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    #menu { max-height: 85dvh; overflow-y: auto; }

    /* ── Celostránkový výběr a detail cvičení ─────────────────── */
    input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    #sheet { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: none; flex-direction: column; height: 100dvh; }
    #sheet.show { display: flex; }
    .sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sheet-head .icon-btn { font-size: 22px; }
    .sheet-title { flex: 1; min-width: 0; font-weight: 800; font-size: 15px; line-height: 1.25; }
    .sheet-title small { display: block; font-weight: 400; font-size: 11px; color: var(--text2); margin-top: 1px; }
    .sheet-search { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sheet-search .search-input { font-size: 16px; }
    .sheet-body { flex: 1; overflow-y: auto; padding: 8px 12px 40px; -webkit-overflow-scrolling: touch; }
    .sheet-foot { flex-shrink: 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
    .sheet-foot .btn { width: 100%; justify-content: center; padding: 13px; font-size: 15px; }
    .pick-count { font-size: 11px; color: var(--text2); margin: 4px 2px 2px; }
    .pick-item { display: flex; gap: 6px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--border); }
    .pick-item .star-btn { font-size: 26px; width: 38px; height: 42px; }
    .pick-main { flex: 1; min-width: 0; cursor: pointer; }
    .pick-main .result-title { font-size: 14px; line-height: 1.3; }
    .add-btn { width: 42px; height: 42px; border-radius: 10px; border: none; background: var(--blue); color: #fff; font-size: 22px; font-weight: 700; flex-shrink: 0; cursor: pointer; }
    .add-btn.done { background: #064e3b; color: #6ee7b7; font-size: 17px; }
    .vid-mark { color: #f87171; font-weight: 700; }
    .btn-video { background: #7f1d1d; color: #fee2e2; border: 1px solid #b91c1c; text-decoration: none; padding: 12px 14px; font-size: 15px; width: 100%; justify-content: center; margin: 10px 0 4px; }
    .detail-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .section-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); margin: 16px 0 6px; }
    .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 10px; }
    .item-card .drill-item-controls input { width: 56px; font-size: 16px; padding: 6px; }
    .item-card .drill-note { font-size: 15px; min-height: 60px; }
    .sheet-body .drill-detail { font-size: 14px; background: transparent; padding: 0; margin-top: 4px; }
    .sheet-body .drill-desc-label { font-size: 11px; }
    .sheet-body .drill-desc-list { padding-left: 18px; }
    .sheet-body .tag-editor input, .sheet-body textarea.drill-note { font-size: 16px; }
    .drill-row { display: flex; align-items: center; gap: 8px; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
    .drill-row:active { border-color: var(--blue); }
    .drill-row .drill-item-sub { white-space: normal; }
    .drill-row-fav { color: #fbbf24; font-size: 14px; flex-shrink: 0; }
    .drill-row-min { font-family: monospace; font-weight: 800; color: #93c5fd; text-align: center; font-size: 16px; line-height: 1; flex-shrink: 0; }
    .drill-row-min small { display: block; font-size: 9px; color: var(--text2); font-family: system-ui; font-weight: 400; }
    .chev { color: var(--muted); font-size: 22px; flex-shrink: 0; }
    .chip-row { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-row .chip { flex-shrink: 0; font-size: 13px; padding: 6px 12px; }
    .chip.filter.part.on { background: #047857; border-color: #10b981; color: #fff; }
    .filter-line { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .fav-check { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: #fde68a; cursor: pointer; }
    .fav-check input { width: 20px; height: 20px; accent-color: #f59e0b; }
    .fav-check small { color: var(--text2); font-weight: 400; }
    .more-filters { margin-top: 8px; max-height: 40dvh; overflow-y: auto; }
    .mf-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); margin: 8px 0 4px; }
    .fchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    /* ══ KOby Coach mobil: spodní lišta, Plán, Hala, Archiv ══ */

    .set-sec input, .set-sec select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; padding: 7px 9px; font-family: inherit; color-scheme: dark; }

    .tb { border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #0b1222; }

    .gen-preview { white-space: pre-wrap; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: var(--text2); max-height: 220px; overflow-y: auto; }

    #print-area { display: none; }
    @media print {
      @page { size: A4; margin: 12mm; }

      body > *:not(#print-area) { display: none !important; }

      #print-area h1 { font-size: 16pt; margin: 0 0 2px; }
      #print-area .pr-sub { font-size: 10pt; color: #333; margin-bottom: 6px; }
      #print-area .pr-eq { font-size: 9.5pt; margin-bottom: 8px; }

      #print-area h2 { font-size: 12.5pt; margin: 12px 0 4px; padding: 3px 6px; background: #ddd; break-after: avoid; page-break-after: avoid; }

  </style>

<div id="menu-overlay" onclick="if(event.target===this)closeMenu()">
  <div id="menu">
   <div id="menu-lib" style="display:none"></div>
   <div id="menu-main">

      <small>Rozpracovaný trénink se předtím sám uloží</small></button>

      <small id="lib-count"></small></button>

      <small>Kategorie, tréninkové dny, pomůcky a pravidla pro generování</small></button>
    <h3 style="margin-top:14px">Moje data v tomto telefonu</h3>

      <small>Uložené tréninky, nastavení, oblíbené, skrytá cvičení, štítky a poznámky do souboru</small></button>

      <small>Načte soubor zálohy (i do nového telefonu)</small></button>

      <small>Odkaz se uloží do fronty a zpracuje se v PC aplikaci</small></button>

      <small>Stáhne aktuální archiv z Google Drive</small></button>

   </div>
  </div>

<div id="sheet"></div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// NASTAVENÍ – adresa, odkud se stahují cvičení (Google Apps Script u Drivu).
// Prázdné = stahuje se z PC serveru (/api/mobile-drills).
// ═══════════════════════════════════════════════════════════════════════════
const DATA_URL = 'https://script.google.com/macros/s/AKfycbybgaePyH33yUQeYr6QNLFCUHwvN_xjBJOThXUO8X-c82FJKuakmgceNYOp6Kd8nESK9w/exec';
// Fronta videí k rozboru (Google skript). Klíč jen brání náhodnému spamu.
const QUEUE_URL = 'https://script.google.com/macros/s/AKfycbybgaePyH33yUQeYr6QNLFCUHwvN_xjBJOThXUO8X-c82FJKuakmgceNYOp6Kd8nESK9w/exec';
const QUEUE_KEY = 'fronta-J5k1YIj4HkLz';

// ═══════════════════════════════════════════════════════════════════════════
// Stav aplikace
// ═══════════════════════════════════════════════════════════════════════════
let allDrills   = [];   // všechna cvičení z archivu
let drillById   = {};
let dataInfo    = null; // { updatedAt, total, fromCache }
let section     = 'handball';
let blocks      = [];   // [{ id, name, plannedMinutes, items: [{drill, duration, notes}] }]
let marks       = {};   // drillId -> { fav: bool, tags: [], note: '' }  (jen v tomto telefonu)
let searchState = {};   // blockId -> dotaz
let filterState = {};   // blockId -> { fav, tag, part, topics:[], form:[], zone:[], u13:[] }
let facetDefs   = [];   // šuplíky z archivu (část tréninku, téma, forma, prostor, U13)
let moreFilters = false; // rozbalené další filtry ve výběru
let showHidden  = false; // zobrazit i cvičení skrytá v tomto telefonu
let openDetails = {};   // klíč -> bool (rozbalený popis)
let searchOpen  = {};
let tagEditOpen = {};   // klíč -> bool (otevřený editor štítků)

const STORAGE_KEY = 'mobile_plan_v1';
const SECTION_KEY = 'mobile_section_v1';
const MARKS_KEY   = 'mobile_marks_v1';
const CACHE_KEY   = 'mobile_drills_cache_v1';
const LIB_KEY         = 'mobile_library_v1';      // uložené tréninky v telefonu
const META_KEY        = 'mobile_current_meta_v1'; // název/datum rozpracovaného tréninku
const CLOUD_PLANS_KEY = 'mobile_cloud_plans_v1';  // mezipaměť sdílených plánů na Disku

let library = [];   // [{ id, name, date, blocks, savedAt }]
let cloudPlans = []; // [{ id, name, title, date, section, ageCategory, blocks, savedAt, updatedAt }]
let cloudPlansState = { loading: false, error: '' };
let meta    = { libId: null, name: '', date: '', time: '', target: 0, focus: '', ageCategory: '', dirty: false };
const TAB_KEY = 'koby_tab_v1';
let tab = 'plan';            // plan | trenink | hala | archiv
let calMonth = '';           // 'YYYY-MM' zobrazený měsíc
let calSel = '';             // vybraný den 'YYYY-MM-DD'
let planForm = null;         // otevřený formulář Naplánovat
let halaIdx = 0;             // které cvičení je v Hale
let wakeLock = null;

// Bezpečný přístup k úložišti telefonu
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) {
  try { localStorage.setItem(k, v); return true; }
  catch (_) { toast('⚠️ Nepodařilo se uložit do telefonu'); return false; }
}

// ═══════════════════════════════════════════════════════════════════════════
// Inicializace
// ═══════════════════════════════════════════════════════════════════════════
setTimeout(async function init() {
  section = lsGet(SECTION_KEY) === 'school' ? 'school' : 'handball';
  tab = 'plan';
  calSel = todayStr(); calMonth = calSel.slice(0, 7);
  loadPlanFromStorage();
  loadMarks();
  loadLibrary();
  loadRules();
  updateSectionTabs();
  const show = () => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    updateNav();
    render();
  };
  // Hned ukázat naposledy stažená cvičení, nová se donačtou na pozadí
  let cached = null;
  try { cached = JSON.parse(lsGet(CACHE_KEY) || 'null'); } catch (_) {}
  if (cached && Array.isArray(cached.drills) && cached.drills.length) {
    setDrills(cached, true);
    document.getElementById('header-sub').textContent += ' · aktualizuji…';
    show();
  }
  await loadDrills();
  loadCloudPlans(true);
  show();
}, 0);

async function loadDrills() {
  const url = DATA_URL || '/api/mobile-drills';
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data.drills)) throw new Error(data.error || 'Neplatná data');
    setDrills(data, false);
    lsSet(CACHE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('Nelze stáhnout cvičení:', e);
    let cached = null;
    try { cached = JSON.parse(lsGet(CACHE_KEY) || 'null'); } catch (_) {}
    if (cached && Array.isArray(cached.drills)) {
      setDrills(cached, true);
    } else {
      document.getElementById('header-sub').textContent = 'Cvičení se nepodařilo načíst – zkontrolujte internet';
    }
  }
}

function setDrills(data, fromCache) {
  allDrills = data.drills || [];
  facetDefs = Array.isArray(data.facetDefs) ? data.facetDefs : [];
  drillById = {};
  allDrills.forEach(d => { drillById[d.id] = d; });
  dataInfo = { updatedAt: data.updatedAt || data.exportedAt, total: allDrills.length, fromCache };
  // Cvičení v uloženém plánu obnovit na nejnovější verzi textu
  refreshDrills(blocks);
  const date = dataInfo.updatedAt ? new Date(dataInfo.updatedAt).toLocaleDateString('cs') : '';
  document.getElementById('header-sub').textContent =
    `${allDrills.length} cvičení · ${date}${fromCache ? ' · offline' : ''}`;
  try {
    const params = new URLSearchParams(location.search);
    const sharedDrillId = params.get('drill');
    if (sharedDrillId && drillById[sharedDrillId] && (!sheet || sheet.drillId !== sharedDrillId)) {
      setTimeout(() => openSharedDrill(sharedDrillId), 120);
    }
  } catch (_) {}
}

async function reloadDrills() {
  closeMenu();
  toast('Načítám…');
  await loadDrills();
  await loadCloudPlans(true);
  render();
  toast(dataInfo && !dataInfo.fromCache ? '✓ Cvičení aktuální' : '⚠️ Jsem offline, používám uložená data');
}

function savePlan(markDirty = true) {
  lsSet(STORAGE_KEY, JSON.stringify(blocks));
  if (markDirty && !meta.dirty) { meta.dirty = true; saveMeta(); updateSaveState(); }
}

function loadPlanFromStorage() {
  try {
    const raw = lsGet(STORAGE_KEY);
    if (raw) blocks = JSON.parse(raw) || [];
  } catch (_) { blocks = []; }
}

// Texty cvičení v plánu obnovit na nejnovější verzi z archivu
function refreshDrills(bl) {
  bl.forEach(b => (b.items || []).forEach(it => { if (drillById[it.drill.id]) it.drill = drillById[it.drill.id]; }));
}

// ═══════════════════════════════════════════════════════════════════════════
// Uložené tréninky (knihovna v tomto telefonu)
// ═══════════════════════════════════════════════════════════════════════════
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${+d}. ${+m}. ${y}`;
}
function defaultName() { return 'Trénink ' + fmtDate(meta.date || todayStr()); }
function planMinutes(bl) { return bl.reduce((s, b) => s + blockDuration(b), 0); }

function loadLibrary() {
  try { library = JSON.parse(lsGet(LIB_KEY) || '[]') || []; } catch (_) { library = []; }
  try { cloudPlans = JSON.parse(lsGet(CLOUD_PLANS_KEY) || '[]') || []; } catch (_) { cloudPlans = []; }
  try { meta = { ...meta, ...(JSON.parse(lsGet(META_KEY) || '{}') || {}) }; } catch (_) {}
  if (!meta.date) meta.date = todayStr();
  if (meta.libId && !library.some(t => t.id === meta.libId) && !cloudPlans.some(t => t.id === meta.libId)) {
    meta.libId = null;
  }
}
function saveLibrary() { usageCache = null; lsSet(LIB_KEY, JSON.stringify(library)); }
function saveCloudPlansCache() { lsSet(CLOUD_PLANS_KEY, JSON.stringify(cloudPlans)); }
function saveMeta() { lsSet(META_KEY, JSON.stringify(meta)); }

function normalizeSharedPlan(p) {
  if (!p || typeof p !== 'object') return null;
  const title = String(p.title || p.name || 'Tréninkový plán').trim();
  const normBlocks = (Array.isArray(p.blocks) ? p.blocks : []).map(b => ({
    id: b.id || uid(),
    name: b.name || 'Blok',
    plannedMinutes: Number(b.plannedMinutes) || 15,
    items: (Array.isArray(b.items) ? b.items : [])
      .filter(it => it && it.drill)
      .map(it => {
        const freshDrill = (it.drill.id && drillById[it.drill.id]) || it.drill;
        const dur = Number(it.duration ?? it.customDuration ?? freshDrill.durationMinutes) || 10;
        const notes = String(it.notes ?? it.customNotes ?? '');
        return { drill: freshDrill, duration: dur, notes };
      })
  }));
  const ts = Number(p.updatedAt || p.savedAt) || Date.now();
  return {
    id: p.id || ('plan-' + ts),
    name: title,
    title,
    date: p.date || '',
    time: p.time || '',
    target: Number(p.target) || 0,
    focus: p.focus || '',
    ageCategory: p.ageCategory || '',
    section: p.section === 'school' ? 'school' : 'handball',
    blocks: normBlocks,
    savedAt: ts,
    updatedAt: ts
  };
}

function toCloudPlanPayload(entry) {
  const name = (entry.name || entry.title || 'Trénink').trim();
  const normBlocks = (Array.isArray(entry.blocks) ? entry.blocks : []).map(b => ({
    id: b.id || uid(),
    name: b.name || 'Blok',
    plannedMinutes: Number(b.plannedMinutes) || 15,
    items: (Array.isArray(b.items) ? b.items : []).map(it => {
      const dur = Number(it.duration ?? it.customDuration ?? it.drill?.durationMinutes) || 10;
      const notes = String(it.notes ?? it.customNotes ?? '');
      return {
        drill: it.drill,
        duration: dur,
        customDuration: dur,
        notes,
        customNotes: notes
      };
    })
  }));
  const now = Date.now();
  return {
    id: entry.id,
    title: name,
    name,
    date: entry.date || '',
    time: entry.time || '',
    target: Number(entry.target) || 0,
    focus: entry.focus || '',
    ageCategory: entry.ageCategory || '',
    section: entry.section || section || 'handball',
    totalMinutes: planMinutes(normBlocks),
    blocks: normBlocks,
    savedAt: entry.savedAt || now,
    updatedAt: now
  };
}

async function loadCloudPlans(silent) {
  cloudPlansState = { loading: true, error: '' };
  if (document.getElementById('menu-lib')?.style.display === 'block') renderLibrary();
  try {
    const endpoint = DATA_URL
      ? `${QUEUE_URL}?treninky=1&key=${encodeURIComponent(QUEUE_KEY)}`
      : '/api/plans';
    const res = await fetch(endpoint, { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    const list = (Array.isArray(data.plans) ? data.plans : Array.isArray(data) ? data : [])
      .map(normalizeSharedPlan)
      .filter(Boolean);
    cloudPlans = list;
    saveCloudPlansCache();
    cloudPlansState = { loading: false, error: '' };
    if (tab === 'plan' && document.getElementById('content').style.display !== 'none' && !planForm) render();
  } catch (e) {
    cloudPlansState = { loading: false, error: 'Nepodařilo se načíst z Disku (offline nebo starší verze skriptu).' };
    if (!silent) toast('⚠️ Nepodařilo se načíst sdílené plány z Disku');
  }
  if (document.getElementById('menu-lib')?.style.display === 'block') renderLibrary();
}

async function syncPlanToCloud(entry) {
  const payload = toCloudPlanPayload(entry);
  try {
    const res = DATA_URL
      ? await fetch(QUEUE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'plans-save', key: QUEUE_KEY, plan: payload })
        })
      : await fetch('/api/plans', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan: payload })
        });
    const data = await res.json();
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    if (Array.isArray(data.plans)) {
      cloudPlans = data.plans.map(normalizeSharedPlan).filter(Boolean);
    } else {
      const idx = cloudPlans.findIndex(p => p.id === payload.id);
      const norm = normalizeSharedPlan(payload);
      if (idx >= 0) cloudPlans[idx] = norm;
      else cloudPlans.unshift(norm);
    }
    saveCloudPlansCache();
    return true;
  } catch (_) {
    return false;
  }
}

function saveStateText() {
  if (!meta.libId) return blocks.length ? 'Neuloženo' : '';
  return meta.dirty ? 'Neuložené změny' : '✓ Uloženo';
}
function updateSaveState() {
  const el = document.getElementById('save-state');
  if (!el) return;
  el.textContent = saveStateText();
  el.className = 'save-state' + (meta.libId && !meta.dirty ? ' ok' : '');
}

function updateMeta(key, val) {
  meta[key] = val;
  meta.dirty = true;
  saveMeta();
  updateSaveState();
}

async function saveTraining(silent, pushCloud) {
  if (!blocks.length && !meta.date) { if (!silent) toast('Plán je prázdný'); return; }
  const name = (meta.name || '').trim() || defaultName();
  const entry = {
    id: meta.libId || ('plan-' + Date.now()),
    name,
    date: meta.date || '',
    time: meta.time || '',
    target: Number(meta.target) || 0,
    focus: meta.focus || '',
    ageCategory: meta.ageCategory || '',
    section,
    blocks: JSON.parse(JSON.stringify(blocks)),
    savedAt: Date.now()
  };
  const i = library.findIndex(t => t.id === entry.id);
  if (i >= 0) library[i] = entry; else library.unshift(entry);
  meta = { ...meta, libId: entry.id, name, dirty: false };
  saveLibrary();
  saveMeta();
  if (!silent) {
    render();
    const okCloud = await syncPlanToCloud(entry);
    if (okCloud) {
      toast(pushCloud ? '☁️ Uloženo i na Disk pro PC' : '💾 Uloženo (v telefonu i na Disku)');
    } else {
      toast('💾 Uloženo v telefonu (offline — na Disk pošlete později)');
    }
  }
}

async function pushLocalPlanToCloud(id) {
  const t = library.find(x => x.id === id);
  if (!t) return;
  toast('☁️ Nahrávám na Google Disk…');
  const ok = await syncPlanToCloud({ ...t, section: t.section || section });
  if (ok) {
    renderLibrary();
    toast('☁️ Trénink uložen na Google Disk (uvidíte ho i v PC)');
  } else {
    toast('⚠️ Nepodařilo se uložit na Google Disk');
  }
}

// Před otevřením jiného tréninku rozpracovaný uložit, ať se nic neztratí
function stashCurrent() {
  if (meta.dirty && (blocks.length || meta.libId)) saveTraining(true);
}

function newTraining() {
  closeMenu();
  const stashed = meta.dirty && blocks.length;
  stashCurrent();
  blocks = [];
  meta = { libId: null, name: '', date: todayStr(), time: '', target: 0, focus: '', ageCategory: '', dirty: false };
  saveMeta();
  savePlan(false);
  searchState = {}; filterState = {};
  halaIdx = 0;
  setTab('trenink');
  toast(stashed ? '💾 Předchozí trénink uložen · nový začíná' : '📄 Nový trénink');
}

function openTraining(id, asCopy, fromCloud) {
  const source = fromCloud ? cloudPlans : library;
  const t = source.find(x => x.id === id) || library.find(x => x.id === id) || cloudPlans.find(x => x.id === id);
  if (!t) return;
  if (!asCopy && meta.libId === id) { closeMenu(); return; }
  stashCurrent();
  blocks = JSON.parse(JSON.stringify(t.blocks || []));
  refreshDrills(blocks);
  if (t.section && (t.section === 'handball' || t.section === 'school') && t.section !== section) {
    section = t.section;
    lsSet(SECTION_KEY, section);
    updateSectionTabs();
  }
  meta = asCopy
    ? { libId: null, name: t.name + ' (kopie)', date: todayStr(), time: t.time || '', target: t.target || 0, focus: t.focus || '', ageCategory: t.ageCategory || '', dirty: true }
    : { libId: t.id, name: t.name, date: t.date, time: t.time || '', target: t.target || 0, focus: t.focus || '', ageCategory: t.ageCategory || '', dirty: false };
  halaIdx = 0;
  if (tab === 'plan' || tab === 'archiv') { tab = 'trenink'; lsSet(TAB_KEY, tab); updateNav(); }
  saveMeta();
  savePlan(false);
  searchState = {}; filterState = {};
  closeMenu();
  render();
  document.getElementById('main').scrollTop = 0;
  toast(asCopy ? '📋 Kopie připravena – upravte a uložte' : '📂 Trénink otevřen');
}

function deleteTraining(id) {
  const t = library.find(x => x.id === id);
  if (!t || !confirm(`Smazat uložený trénink „${t.name}“ z telefonu?`)) return;
  if (meta.libId === id) { meta.libId = null; }
  library = library.filter(x => x.id !== id);
  if (meta.libId === id && !cloudPlans.some(c => c.id === id)) { meta.libId = null; meta.dirty = true; saveMeta(); }
  saveLibrary();
  renderLibrary();
  render();
}

async function deleteCloudPlan(id) {
  const t = cloudPlans.find(x => x.id === id);
  if (!t || !confirm(`Smazat sdílený trénink „${t.name}“ z Google Disku (zmizí i v PC)?`)) return;
  const remaining = cloudPlans.filter(x => x.id !== id);
  try {
    const res = DATA_URL
      ? await fetch(QUEUE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'plans-save', key: QUEUE_KEY, plans: remaining.map(toCloudPlanPayload) })
        })
      : await fetch('/api/plans', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plans: remaining.map(toCloudPlanPayload), deleteId: id })
        });
    const data = await res.json();
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    cloudPlans = remaining;
    saveCloudPlansCache();
    if (meta.libId === id && !library.some(x => x.id === id)) { meta.libId = null; meta.dirty = true; saveMeta(); }
    renderLibrary();
    render();
    toast('🗑️ Plán smazán z Google Disku');
  } catch (_) {
    toast('⚠️ Nepodařilo se smazat plán z Google Disku');
  }
}

function openLibrary() {
  document.getElementById('menu-main').style.display = 'none';
  document.getElementById('menu-lib').style.display = 'block';
  renderLibrary();
  document.getElementById('menu-overlay').classList.add('show');
  loadCloudPlans(true);
}

function renderLibrary() {
  const el = document.getElementById('menu-lib');
  const cloudList = [...cloudPlans].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.updatedAt || b.savedAt || 0) - (a.updatedAt || a.savedAt || 0));
  const localList = [...library].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.savedAt || 0) - (a.savedAt || 0));
  let h = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <h3 style="flex:1">📚 Tréninky (${cloudList.length + localList.length})</h3>
      <button class="btn btn-surface btn-sm" onclick="loadCloudPlans(false)" ${cloudPlansState.loading ? 'disabled' : ''}>🔄 Disk</button>
      <button class="btn btn-blue btn-sm" onclick="newTraining()">＋ Nový</button>
      <button class="icon-btn" onclick="closeMenu()">✕</button>
    </div>`;

  h += `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#93c5fd;margin:6px 0">☁️ Sdílené na Google Disku (PC ↔ Mobil)</div>`;
  if (cloudPlansState.loading && !cloudList.length) {
    h += `<div class="menu-sub">Načítám sdílené plány z Google Disku…</div>`;
  } else if (!cloudList.length) {
    h += `<div class="menu-sub">${esc(cloudPlansState.error || 'Na Google Disku zatím žádný sdílený plán není. Když v mobilu nebo v PC uložíte plán, ukáže se tady.')}</div>`;
  } else {
    cloudList.forEach(t => {
      const drills = (t.blocks || []).reduce((s, b) => s + (b.items || []).length, 0);
      const cur = t.id === meta.libId;
      const secTag = t.section === 'school' ? ' · Škola' : '';
      h += `<div class="lib-item ${cur ? 'current' : ''}">
          <div class="lib-title">${esc(t.name)}${cur ? ' <span style="color:#93c5fd;font-size:11px">· otevřený</span>' : ''}</div>
          <div class="lib-sub">${esc(fmtDate(t.date))}${secTag} · ${planMinutes(t.blocks || [])} min · ${(t.blocks || []).length} bloků · ${drills} cvičení</div>
          <div class="lib-btns">
            ${cur ? '' : `<button class="btn btn-blue btn-sm" onclick="openTraining('${jsStr(t.id)}', false, true)">📂 Otevřít</button>`}
            <button class="btn btn-surface btn-sm" onclick="openTraining('${jsStr(t.id)}', true, true)">📋 Použít jako základ</button>
            <button class="btn btn-red btn-sm" onclick="deleteCloudPlan('${jsStr(t.id)}')">Smazat</button>
          </div>
        </div>`;
    });
  }

  h += `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:14px 0 6px">📱 Uložené v tomto telefonu (${localList.length})</div>`;
  if (!localList.length) {
    h += `<div class="menu-sub">Zatím žádný lokální trénink. Poskládejte plán a stiskněte 💾 Uložit.</div>`;
  } else {
    localList.forEach(t => {
      const drills = (t.blocks || []).reduce((s, b) => s + (b.items || []).length, 0);
      const cur = t.id === meta.libId;
      const onCloud = cloudPlans.some(c => c.id === t.id);
      h += `<div class="lib-item ${cur ? 'current' : ''}">
          <div class="lib-title">${esc(t.name)}${cur ? ' <span style="color:#93c5fd;font-size:11px">· otevřený</span>' : ''}</div>
          <div class="lib-sub">${esc(fmtDate(t.date))} · ${planMinutes(t.blocks || [])} min · ${(t.blocks || []).length} bloků · ${drills} cvičení</div>
          <div class="lib-btns">
            ${cur ? '' : `<button class="btn btn-blue btn-sm" onclick="openTraining('${jsStr(t.id)}', false, false)">📂 Otevřít</button>`}
            <button class="btn btn-surface btn-sm" onclick="pushLocalPlanToCloud('${jsStr(t.id)}')">${onCloud ? '☁️ Aktualizovat na Disku' : '☁️ Nahrát na Disk'}</button>
            <button class="btn btn-surface btn-sm" onclick="openTraining('${jsStr(t.id)}', true, false)">📋 Kopie</button>
            <button class="btn btn-red btn-sm" onclick="deleteTraining('${jsStr(t.id)}')">Smazat</button>
          </div>
        </div>`;
    });
  }
  el.innerHTML = h;
}

function loadMarks() {
  try { marks = JSON.parse(lsGet(MARKS_KEY) || '{}') || {}; } catch (_) { marks = {}; }
}
function saveMarks() { lsSet(MARKS_KEY, JSON.stringify(marks)); }
function markOf(id) { return marks[id] || { fav: false, tags: [], note: '' }; }
function setMark(id, patch) {
  const m = { ...markOf(id), ...patch };
  if (!m.fav && !m.hidden && !(m.tags && m.tags.length) && !(m.note && m.note.trim())) delete marks[id];
  else marks[id] = m;
  saveMarks();
}

function toggleFav(id) {
  const on = !markOf(id).fav;
  setMark(id, { fav: on });
  render();
  toast(on ? '⭐ Přidáno do oblíbených' : 'Odebráno z oblíbených');
}

function allMyTags() {
  const set = new Set();
  Object.values(marks).forEach(m => (m.tags || []).forEach(t => set.add(t)));
  return [...set].sort((a, b) => a.localeCompare(b, 'cs'));
}

function addTag(id, inputId) {
  const input = document.getElementById(inputId);
  const t = (input && input.value || '').trim().replace(/\s+/g, ' ').slice(0, 30);
  if (!t) return;
  const tags = markOf(id).tags || [];
  if (!tags.some(x => x.toLowerCase() === t.toLowerCase())) setMark(id, { tags: [...tags, t] });
  render();
  requestAnimationFrame(() => { const el = document.getElementById(inputId); if (el) el.focus(); });
}

function addExistingTag(id, t) {
  const tags = markOf(id).tags || [];
  if (!tags.includes(t)) setMark(id, { tags: [...tags, t] });
  render();
}

function removeTag(id, t) {
  setMark(id, { tags: (markOf(id).tags || []).filter(x => x !== t) });
  render();
}

function updateMyNote(id, val) { setMark(id, { note: val }); }

function toggleTagEdit(key) { tagEditOpen[key] = !tagEditOpen[key]; render(); }

// Logika bloků
// ═══════════════════════════════════════════════════════════════════════════
function uid() { return `b${Date.now()}-${Math.random().toString(36).slice(2,6)}`; }

function addBlock() {
  const idx = blocks.filter(b => /^\d+\. blok$/.test(b.name)).length + 1;
  blocks.push({ id: uid(), name: `${idx}. blok`, plannedMinutes: 15, items: [] });
  savePlan();
  render();
  requestAnimationFrame(() => {
    const els = document.querySelectorAll('.block');
    if (els.length) els[els.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function removeBlock(id) {
  if (!confirm('Smazat tento blok?')) return;
  blocks = blocks.filter(b => b.id !== id);
  savePlan();
  render();
}

function moveBlock(id, dir) {
  const i = blocks.findIndex(b => b.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  savePlan();
  render();
}

function updateBlockName(id, name) {
  const b = blocks.find(b => b.id === id);
  if (b) { b.name = name; savePlan(); }
}

function updateBlockMinutes(id, val) {
  const b = blocks.find(b => b.id === id);
  if (b) { b.plannedMinutes = parseInt(val) || 5; savePlan(); render(); }
}

function blockDuration(b) {
  if (b.items.length === 0) return b.plannedMinutes;
  return b.items.reduce((s, i) => s + i.duration, 0);
}

// ═══════════════════════════════════════════════════════════════════════════
// Logika cvičení v bloku
// ═══════════════════════════════════════════════════════════════════════════
function addDrillToBlock(blockId, drillId) {
  const b = blocks.find(b => b.id === blockId);
  const drill = drillById[drillId];
  if (!b || !drill) return;
  if (b.items.some(i => i.drill.id === drill.id)) { toast('Cvičení už v bloku je'); return; }
  b.items.push({ drill, duration: drill.durationMinutes || 10, notes: '' });
  savePlan();
  render();
  toast('✓ Přidáno do bloku');
}

function removeDrillFromBlock(blockId, drillId) {
  const b = blocks.find(b => b.id === blockId);
  if (!b) return;
  b.items = b.items.filter(i => i.drill.id !== drillId);
  savePlan();
  render();
}

function moveDrill(blockId, drillId, dir) {
  const b = blocks.find(b => b.id === blockId);
  if (!b) return;
  const i = b.items.findIndex(i => i.drill.id === drillId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= b.items.length) return;
  [b.items[i], b.items[j]] = [b.items[j], b.items[i]];
  savePlan();
  render();
}

function updateDrillDuration(blockId, drillId, val) {
  const b = blocks.find(b => b.id === blockId);
  if (!b) return;
  const item = b.items.find(i => i.drill.id === drillId);
  if (item) { item.duration = parseInt(val) || 5; savePlan(); render(); }
}

function updateDrillNotes(blockId, drillId, val) {
  const b = blocks.find(b => b.id === blockId);
  if (!b) return;
  const item = b.items.find(i => i.drill.id === drillId);
  if (item) { item.notes = val; savePlan(); }
}

function toggleDetail(key) { openDetails[key] = !openDetails[key]; render(); }
function toggleSearchOpen(key) { searchOpen[key] = !searchOpen[key]; render(); }

// Hledání a filtry

function normalize(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

const EMPTY_FILTER = () => ({ fav: false, tag: null, part: '', topics: [], posts: [], form: [], zone: [], u13: [], dur: [], players: 0, noEquip: [] });
const ARCH = '__arch';
function getBlk(id) {
  if (id === ARCH) return { id: ARCH, name: 'Archiv cvičení', plannedMinutes: 0, items: blocks.flatMap(b => b.items) };
  return blocks.find(b => b.id === id);
}
function filterOf(blockId) { return { ...EMPTY_FILTER(), ...(filterState[blockId] || {}) }; }
function setFilter(blockId, patch) { filterState[blockId] = { ...filterOf(blockId), ...patch }; render(); }

function toggleFilterFav(blockId) { setFilter(blockId, { fav: !filterOf(blockId).fav }); }
function toggleFilterTag(blockId, tag) { const f = filterOf(blockId); setFilter(blockId, { tag: f.tag === tag ? null : tag }); }
function setFilterPart(blockId, part) { const f = filterOf(blockId); setFilter(blockId, { part: f.part === part ? '' : part }); }
function toggleFilterFacet(blockId, key, id) {
  const cur = filterOf(blockId)[key] || [];
  setFilter(blockId, { [key]: cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id] });
}
function clearFilters(blockId) { filterState[blockId] = { ...EMPTY_FILTER(), part: filterOf(blockId).part }; render(); }
function toggleMoreFilters() { moreFilters = !moreFilters; render(); }
function extraFilterCount(f) {
  return (f.fav ? 1 : 0) + (f.tag ? 1 : 0) + (f.players ? 1 : 0) + ['topics','posts','form','zone','u13','dur','noEquip'].reduce((n, k) => n + (f[k] || []).length, 0);
}
// Výchozí filtr výběru: pomůcky, které trenér v Nastavení označil jako „nemáme“, rovnou vyřadit
function startFilter(part) { return { ...EMPTY_FILTER(), part: part || '', noEquip: [...(rules.missingEquip || [])] }; }

// ── Délka, počet hráčů a pomůcky: v archivu jsou to volné texty, sjednotí se do skupin ──
const DUR_OPTS = [
  { id: 'd5',  label: 'do 5 min',   min: 0,  max: 5 },
  { id: 'd10', label: '6–10 min',   min: 6,  max: 10 },
  { id: 'd15', label: '11–15 min',  min: 11, max: 15 },
  { id: 'd16', label: 'nad 15 min', min: 16, max: 999 }
];
const PLAYER_OPTS = [4, 6, 8, 10, 12, 14, 16];
const EQUIP_GROUPS = [
  { id: 'cones',     label: 'Kužely, mety',        re: /kuzel|\bmet(y|a|ove)?\b|konick/ },
  { id: 'goal',      label: 'Branka',              re: /\bbrank(a|y)\b/ },
  { id: 'bibs',      label: 'Rozlišováky',         re: /rozlis|vest|dres/ },
  { id: 'figures',   label: 'Figuríny',            re: /figur|maneky|panac/ },
  { id: 'obstacles', label: 'Překážky, step boxy', re: /prekaz|step|slalom|tyc/ },
  { id: 'mats',      label: 'Žíněnky, podložky',   re: /zinen|podloz/ },
  { id: 'strength',  label: 'Gumy, medicinbaly',   re: /\bgum|medicin/ },
  { id: 'balls',     label: 'Míče',                re: /\bmic(e|u|i)?\b/ }
];
function drillEquipGroups(d) {
  if (!d._eq) {
    const txt = (d.equipment || []).map(normalize);
    d._eq = EQUIP_GROUPS.filter(g => txt.some(t => g.re.test(t))).map(g => g.id);
  }
  return d._eq;
}
// Nejmenší počet hráčů, se kterým cvičení jde („8-12 hráčů“ → 8, „celý tým“ → bez omezení)
function drillMinPlayers(d) {
  const s = normalize(d.playerCount);
  const m = s.match(/\d+/);
  if (m) return +m[0];
  if (/dvojic/.test(s) && !/tym/.test(s)) return 2;
  return 0;
}
function durOk(d, ids) {
  const min = Number(d.durationMinutes) || 10;
  return DUR_OPTS.some(o => ids.includes(o.id) && min >= o.min && min <= o.max);
}

function facetDefOf(key) { return facetDefs.find(d => d.key === key); }
function facetVals(d, key) {
  const v = d && d.facets ? d.facets[key] : null;
  return Array.isArray(v) ? v : (v ? [v] : []);
}
function facetLbl(key, id, short) {
  const def = facetDefOf(key);
  const o = def && def.options.find(x => x.id === id);
  return o ? (short && o.short) || o.label : id;
}
function sectionHasFacets() { return facetDefs.length && allDrills.some(d => d.section === section && d.facets && d.facets.part); }

// Předvolba části tréninku podle názvu bloku (Rozcvička, Hlavní část, Hra…)
function guessPart(name) {
  const n = normalize(name);
  if (/rozcv|zahr|zahrat|warm/.test(n)) return 'warmup';
  if (/prupr|techn/.test(n)) return 'technique';
  if (/hlavn/.test(n)) return 'main';
  if (/\bhra\b|\bhry\b|\bhru\b|zapas/.test(n)) return 'game';
  if (/kondi/.test(n)) return 'fitness';
  if (/zaver|protaz|uklid/.test(n)) return 'cooldown';
  return '';
}

// Kolikrát a kdy naposledy bylo cvičení v uložených trénincích
let usageCache = null;
function usageOf(id) {
  if (!usageCache) {
    usageCache = {};
    library.forEach(t => (t.blocks || []).forEach(b => (b.items || []).forEach(it => {
      const k = it.drill && it.drill.id; if (!k) return;
      const u = usageCache[k] || (usageCache[k] = { count: 0, last: '' });
      u.count++;
      if ((t.date || '') > u.last) u.last = t.date || '';
    })));
  }
  return usageCache[id];
}
function usageText(id) {
  const u = usageOf(id);
  if (!u) return '<span style="color:#6ee7b7">zatím nepoužito</span>';
  const d = u.last ? (() => { const [y, m, dd] = u.last.split('-'); return ` · naposledy ${+dd}. ${+m}.`; })() : '';
  return `použito ${u.count}×${d}`;
}

function searchDrills(query, block) {
  const q = normalize(query.trim());
  const f = filterOf(block.id);
  const words = q.split(/\s+/).filter(w => w.length > 1);

  const list = allDrills.filter(d => {
    if (d.section !== section) return false;
    const m = markOf(d.id);
    if (m.hidden && !showHidden) return false;
    if (f.fav && !m.fav) return false;
    if (f.tag && !(m.tags || []).includes(f.tag)) return false;
    if (f.part && !facetVals(d, 'part').includes(f.part)) return false;
    for (const k of ['topics', 'posts', 'form', 'zone', 'u13']) {
      const want = f[k] || [];
      const has = facetVals(d, k);
      // „Všechny posty“ se hodí pro kterýkoli post
      if (want.length && !want.some(w => has.includes(w) || (k === 'posts' && has.includes('all')))) return false;
    }
    if ((f.dur || []).length && !durOk(d, f.dur)) return false;
    if (f.players && drillMinPlayers(d) > f.players) return false;
    if ((f.noEquip || []).length && drillEquipGroups(d).some(g => f.noEquip.includes(g))) return false;
    return true;
  });

  if (!words.length) {
    return list.sort((a, b) => a.title.localeCompare(b.title, 'cs'));
  }

  return list.map(d => {
    const m = markOf(d.id);
    const haystack = normalize([
      d.title, d.objective, d.category, d.seminarTitle, d.seminarPresenter,
      (d.coachingPoints || []).join(' '),
      (d.tags || []).join(' '),
      (m.tags || []).join(' '), m.note || ''
    ].join(' '));
    const title = normalize(d.title);
    const score = words.reduce((acc, w) =>
      acc + (title.includes(w) ? 3 : 0) + (haystack.includes(w) ? 1 : 0), 0);
    return { d, score: score + (m.fav && score > 0 ? 1 : 0) };
  }).filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 40)
    .map(x => x.d);
}

function render() {
  refreshSheet();
  const content = document.getElementById('content');
  document.body.classList.toggle('tab-other', tab !== 'trenink');
  document.getElementById('fab-area').style.display = tab === 'trenink' ? 'flex' : 'none';
  document.getElementById('section-tabs').style.display = (tab === 'trenink' || tab === 'archiv') ? 'flex' : 'none';
  if (tab === 'plan') { content.innerHTML = renderPlan(); return; }
  if (tab === 'hala') { content.innerHTML = renderHala(); return; }
  if (tab === 'archiv') { content.innerHTML = renderArchiv(); return; }
  renderTraining(content);
}

function renderTraining(content) {

  if (blocks.length === 0) {
    content.innerHTML = trainingBar() + `
      <div class="empty-state">
        <div class="icon">📋</div>
        <h2>Zatím žádný blok</h2>
        <p style="margin:6px 0 12px"><button class="btn btn-blue" style="padding:12px 18px;font-size:15px" onclick="openGen()">✨ Vygenerovat trénink</button></p>
        <p>Nebo stiskněte + Přidat blok a skládejte ručně.</p>
        ${library.length ? `<p style="margin-top:14px"><button class="btn btn-surface" onclick="openLibrary()">📚 Otevřít uložený trénink (${library.length})</button></p>` : ''}
      </div>`;
    return;
  }

  const starts = [];
  blocks.reduce((t, b) => { starts.push(t); return t + blockDuration(b); }, 0);
  const total = blocks.reduce((s, b) => s + blockDuration(b), 0);
  const allItems = blocks.flatMap(b => b.items);

  let html = trainingBar() + `
    <div class="summary-bar">
      <div class="summary-stat"><div class="summary-num">${total}</div><div class="summary-lbl">${meta.target ? `z ${meta.target} plánovaných` : 'minut'}</div></div>
      <div class="summary-stat"><div class="summary-num">${blocks.length}</div><div class="summary-lbl">bloků</div></div>
      <div class="summary-stat"><div class="summary-num">${allItems.length}</div><div class="summary-lbl">cvičení</div></div>
    </div>${checkBox()}${equipBox()}`;

  const fmt = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;

  blocks.forEach((block, bi) => {
    const start  = starts[bi];
    const dur    = blockDuration(block);
    const sumDur = block.items.reduce((s, i) => s + i.duration, 0);

    html += `<div class="block" id="block-${block.id}">
      <div class="block-header">
        <span class="block-time">${fmt(start)}–${fmt(start+dur)}</span>
        <input class="block-name-input" value="${esc(block.name)}"
          oninput="updateBlockName('${block.id}', this.value)" />
        <div class="block-dur">`;

    if (block.items.length === 0) {
      html += `<input type="number" min="1" max="180" value="${block.plannedMinutes}"
        onchange="updateBlockMinutes('${block.id}', this.value)" /><span>min</span>`;
    } else {
      html += `<span style="font-family:monospace;font-weight:700;color:#f1f5f9">${sumDur} min</span>`;
    }

    html += `</div>
        <div class="block-actions">
          <button class="icon-btn" onclick="regenBlock('${block.id}')" title="Vygenerovat obsah bloku">✨</button>
          <button class="icon-btn" onclick="moveBlock('${block.id}', -1)" ${bi===0?'disabled':''} title="Nahoru">↑</button>
          <button class="icon-btn" onclick="moveBlock('${block.id}', 1)"  ${bi===blocks.length-1?'disabled':''} title="Dolů">↓</button>
          <button class="icon-btn del" onclick="removeBlock('${block.id}')" title="Smazat">✕</button>
        </div>
      </div>
      <div class="block-body">`;

    // Cvičení v bloku – stručný řádek, klepnutím se otevře detail
    block.items.forEach(item => {
      const d = item.drill;
      const id = d.id;
      const fav = markOf(id).fav;
      const sub = [d.seminarPresenter, videoLink(d) ? '<span class="vid-mark">▶ video</span>' : '']
        .filter(Boolean).map(x => x.startsWith('<') ? x : esc(x)).join(' · ');
      const note = (item.notes || '').trim();
      html += `
        <div class="drill-row" onclick="openItem('${block.id}','${jsId(id)}')">
          ${fav ? '<span class="drill-row-fav">★</span>' : ''}
          <div class="drill-item-info">
            <div class="drill-item-title">${esc(d.title)}</div>
            ${sub ? `<div class="drill-item-sub">${sub}</div>` : ''}
            ${note ? `<div class="drill-item-sub" style="color:#fbbf24">📝 ${esc(note)}</div>` : ''}
          </div>
          <div class="drill-row-min">${item.duration}<small>min</small></div>
          <button class="swap-btn" onclick="event.stopPropagation();swapDrill('${block.id}','${jsId(id)}')" title="Vyměnit za jiné vhodné cvičení">↻</button>
        </div>`;
    });

    html += `<button class="add-drill-btn" onclick="openPicker('${block.id}')">＋ Přidat cvičení</button>`;
    html += `</div></div>`; // .block-body .block
  });

  content.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
// Video (YouTube) – otevře se v aplikaci YouTube od začátku cvičení
// ═══════════════════════════════════════════════════════════════════════════
function videoLink(d) {
  const u = String((d && d.videoUrl) || '').trim();
  if (!u) return '';
  const t = Math.max(0, parseInt(d.videoStart, 10) || 0);
  const m = u.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  if (m) return `https://youtu.be/${m[1]}${t ? `?t=${t}` : ''}`;
  return u;
}
function fmtSec(t) {
  t = Math.max(0, parseInt(t, 10) || 0);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return (h ? `${h}:${String(m).padStart(2,'0')}` : `${m}`) + ':' + String(s).padStart(2,'0');
}
function youtubeId(d) {
  const m = String((d && d.videoUrl) || '').match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : '';
}
let videoOpenFor = null;   // cvičení, jehož video se právě přehrává v aplikaci
function toggleVideo(id) {
  videoOpenFor = videoOpenFor === id ? null : id;
  const wrap = document.getElementById('video-slot');
  const d = (sheet && (drillById[id] || null)) || drillById[id];
  if (wrap) wrap.outerHTML = videoButton(d || { id });
  else renderSheet();
}
function videoButton(d) {
  const link = videoLink(d);
  if (!link) return '';
  const t = parseInt(d.videoStart, 10) || 0;
  const endSec = parseInt(d.videoEnd, 10) || 0;
  const hasRange = endSec > t;
  const yt = youtubeId(d);
  const from = hasRange
    ? ` výsek (${fmtSec(t)} – ${fmtSec(endSec)}, ${endSec - t} s)`
    : (t ? ` od ${fmtSec(t)}` : '');
  const ext = `<a class="video-ext" href="${esc(link)}" target="_blank" rel="noopener">Otevřít v aplikaci YouTube ↗</a>`;
  if (!yt) return `<div id="video-slot"><a class="btn btn-video" href="${esc(link)}" target="_blank" rel="noopener">▶ Pustit video${from}</a></div>`;
  if (videoOpenFor !== d.id) {
    return `<div id="video-slot"><button class="btn btn-video" onclick="toggleVideo('${jsId(d.id)}')">▶ Přehrát video${from}</button>${ext}</div>`;
  }
  const endParam = hasRange ? `&end=${endSec}` : '';
  const src = `https://www.youtube-nocookie.com/embed/${yt}?start=${t}${endParam}&autoplay=1&playsinline=1&rel=0&modestbranding=1`;
  return `<div id="video-slot">
      <div class="video-frame" data-src="${esc(src)}"><iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      <div class="video-bar"><button class="btn btn-surface btn-sm" onclick="toggleVideo('${jsId(d.id)}')">✕ Zavřít video</button>${ext}</div>
    </div>`;
}

function renderMobileBoardWidget(drill) {

  if (!phases.length) return '';
  return `
    <div class="item-card" style="background:#0b1528;border-color:#1e3a8a;margin-top:12px;padding:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <div style="font-size:12px;font-weight:800;color:#38bdf8;text-transform:uppercase;letter-spacing:.04em;">♟️ Taktická tabule (${phases.length} tahů)</div>
        <div style="display:flex;gap:6px;">
          <button id="mob-board-play-btn" class="btn btn-blue btn-sm" onclick="toggleMobBoardPlay()">▶ Přehrát animaci</button>
          <button class="btn btn-surface btn-sm" onclick="shareSingleDrillLink('${jsId(drill.id)}')">📤 Sdílet kolegům</button>
        </div>
      </div>
      <canvas id="mob-board-canvas" width="600" height="440" style="width:100%;height:auto;border-radius:10px;background:#071936;display:block;border:1px solid #1e40af;"></canvas>
      <div id="mob-board-caption" style="font-size:12.5px;font-weight:700;color:#fde047;margin-top:7px;line-height:1.35;"></div>
      <div id="mob-board-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;"></div>
    </div>
  `;
}

function initMobBoardForDrill(drill) {
  stopMobBoardAnim();
  const phases = Array.isArray(drill && drill.boardPhases) ? drill.boardPhases : [];
  if (!phases.length) return;
  if (mobBoardState.drillId !== drill.id) {
    mobBoardState.drillId = drill.id;
    mobBoardState.phaseIdx = 0;
    mobBoardState.progress = 0;
  }
  mobBoardState.phases = phases;
  updateMobBoardControls();
  drawMobBoardFrame();
}

function selectMobBoardPhase(idx) {
  stopMobBoardAnim();
  mobBoardState.phaseIdx = Math.max(0, Math.min(mobBoardState.phases.length - 1, idx));
  mobBoardState.progress = 0;
  updateMobBoardControls();
  drawMobBoardFrame();
}

function updateMobBoardControls() {
  const phases = mobBoardState.phases || [];
  const idx = mobBoardState.phaseIdx || 0;
  const cap = document.getElementById('mob-board-caption');
  if (cap && phases[idx]) {
    cap.textContent = phases[idx].title || `Tah ${idx + 1}`;
  }
  const chips = document.getElementById('mob-board-chips');
  if (chips) {
    chips.innerHTML = phases.map((p, i) => `
      <button class="btn ${i === idx ? 'btn-blue' : 'btn-surface'} btn-sm" onclick="selectMobBoardPhase(${i})">
        Tah ${i + 1}
      </button>
    `).join('');
  }
}

function toggleMobBoardPlay() {
  if ((mobBoardState.phases || []).length < 2) {
    toast('Toto cvičení má 1 tah');
    return;
  }
  if (mobBoardState.playing) {
    stopMobBoardAnim();
    drawMobBoardFrame();
    return;
  }
  if (mobBoardState.phaseIdx >= mobBoardState.phases.length - 1) {
    mobBoardState.phaseIdx = 0;
  }
  mobBoardState.playing = true;
  mobBoardState.progress = 0;
  mobBoardState.lastTs = performance.now();
  const btn = document.getElementById('mob-board-play-btn');
  if (btn) btn.innerHTML = '⏸ Pauza';
  mobBoardState.rafId = requestAnimationFrame(stepMobBoardAnim);
}

function stepMobBoardAnim(ts) {
  if (!mobBoardState.playing) return;
  const dt = Math.min(0.1, (ts - (mobBoardState.lastTs || ts)) / 1000);
  mobBoardState.lastTs = ts;
  mobBoardState.progress += dt * 0.65;
  if (mobBoardState.progress >= 1) {
    mobBoardState.progress = 0;
    if (mobBoardState.phaseIdx < mobBoardState.phases.length - 2) {
      mobBoardState.phaseIdx++;
    } else {
      mobBoardState.phaseIdx = 0;
    }
    updateMobBoardControls();
  }
  drawMobBoardFrame();
  mobBoardState.rafId = requestAnimationFrame(stepMobBoardAnim);
}

function drawMobBoardFrame() {
  const cv = document.getElementById('mob-board-canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const phases = mobBoardState.phases || [];
  if (!phases.length) return;

  const pA = phases[mobBoardState.phaseIdx] || phases[0];
  const pB = phases[Math.min(phases.length - 1, mobBoardState.phaseIdx + 1)] || pA;
  const t = mobBoardState.playing ? mobBoardState.progress : 0;
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  // Mapování 3D hřiště (x: -10..+10 m, z: 0..16.5 m) na 2D plátno
  const mapX = (x) => W / 2 + (Number(x || 0) / 10.5) * (W * 0.46);
  const mapZ = (z) => 28 + (Math.min(18, Math.max(0, Number(z || 0))) / 16.5) * (H - 46);

  // Palubovka EHF
  ctx.fillStyle = '#072a60';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(24, 28, W - 48, H - 40);

  // Brankoviště 6 m
  const r6X = (6 / 10.5) * (W * 0.46);
  const r6Y = (6 / 16.5) * (H - 46);
  ctx.fillStyle = '#0077b6';
  ctx.beginPath();
  ctx.moveTo(mapX(-1.5) - r6X, 28);
  ctx.arc(mapX(-1.5), 28, r6X, Math.PI, Math.PI * 0.5, true);
  ctx.lineTo(mapX(1.5), 28 + r6Y);
  ctx.arc(mapX(1.5), 28, r6X, Math.PI * 0.5, 0, true);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Čára 9 m (přerušovaná)
  const r9X = (9 / 10.5) * (W * 0.46);
  ctx.save();
  ctx.setLineDash([8, 7]);
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(mapX(0), 28, r9X, 0.12 * Math.PI, 0.88 * Math.PI, false);
  ctx.stroke();
  ctx.restore();

  // Branka (3 m)
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 5;
  ctx.strokeRect(mapX(-1.5), 14, mapX(1.5) - mapX(-1.5), 14);

  // Šipky aktuálního tahu
  (pA.drawings || []).forEach(d => {
    const x1 = mapX(d.x1), y1 = mapZ(d.z1), x2 = mapX(d.x2), y2 = mapZ(d.z2);
    ctx.save();
    let col = '#38bdf8';
    if (d.type === 'pass') { col = '#fde047'; ctx.setLineDash([6, 5]); }
    else if (d.type === 'shot') col = '#f43f5e';
    else if (d.type === 'dribble') col = '#c084fc';
    else if (d.type === 'screen') col = '#10b981';
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);
    const ang = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 11 * Math.cos(ang - 0.4), y2 - 11 * Math.sin(ang - 0.4));
    ctx.lineTo(x2 - 11 * Math.cos(ang + 0.4), y2 - 11 * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Hráči a kužely (interpolované mezi pA a pB)
  const interpPieces = (pA.pieces || []).map(pa => {
    const pb = (pB.pieces || []).find(x => x.id === pa.id) || pa;
    return {
      ...pa,
      x: pa.x + (pb.x - pa.x) * ease,
      z: pa.z + (pb.z - pa.z) * ease
    };
  });

  interpPieces.forEach(p => {
    const cx = mapX(p.x), cy = mapZ(p.z);
    if (p.team === 'cone' || p.team === 'hurdle') {
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 9);
      ctx.lineTo(cx - 8, cy + 7);
      ctx.lineTo(cx + 8, cy + 7);
      ctx.closePath();
      ctx.fill();
      return;
    }
    const col = p.team === 'gk' ? '#10b981' : (p.team === 'defense' ? '#e11d48' : (p.color || '#0ea5e9'));
    ctx.fillStyle = col;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(cx, cy, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.role || String(p.num || ''), cx, cy);
  });

  // Míč
  const holderA = interpPieces.find(x => x.id === pA.ballHolderId);
  const holderB = interpPieces.find(x => x.id === pB.ballHolderId) || holderA;
  if (holderA) {
    const bx = mapX(holderA.x + ((holderB ? holderB.x : holderA.x) - holderA.x) * ease) + 12;
    const by = mapZ(holderA.z + ((holderB ? holderB.z : holderA.z) - holderA.z) * ease) - 10;
    ctx.fillStyle = '#fde047';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bx, by, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

async function shareSingleDrillLink(drillId) {
  const d = drillById[drillId];
  if (!d) return;
  const baseUrl = location.origin.includes('github.io')
    ? `${location.origin}${location.pathname}`
    : 'https://sokolkobylisymlzi-hub.github.io/planovac-treninku/';
  const link = `${baseUrl}?drill=${encodeURIComponent(d.id)}`;
  const t = parseInt(d.videoStart, 10) || 0;
  const e = parseInt(d.videoEnd, 10) || 0;
  const rangeTxt = e > t ? ` (${fmtSec(t)}–${fmtSec(e)})` : '';
  const text = [
    `🤾 Cvičení: ${d.title}${rangeTxt}`,
    d.coachNote ? `📝 Poznámka: ${d.coachNote}` : '',
    d.organization ? `📐 Popis: ${d.organization}` : '',
    `📲 Otevřít v mobilním Archivu cvičení:`,
    link
  ].filter(Boolean).join('\n');
  try {
    if (navigator.share) { await navigator.share({ title: d.title, text, url: link }); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(text);
    toast('✓ Odkaz na cvičení zkopírován pro kolegy');
  } catch (_) {
    prompt('Zkopírujte odkaz pro kolegy:', text);
  }
}

const FROM_KEY = 'mobile_queue_from_v1';
let queueState = { url: '', note: '', section: 'handball', msg: '', msgType: '', sending: false, list: null, listError: '' };

function openQueueForm(prefillUrl, prefillNote) {

async function loadQueueList() {
  try {
    const res = await fetch(`${QUEUE_URL}?fronta=1&key=${encodeURIComponent(QUEUE_KEY)}`, { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'chyba');
    queueState.list = data.items || [];
    queueState.listError = '';
  } catch (e) {
    queueState.listError = 'Seznam se nepodařilo načíst (jste online?)';
  }
  if (sheet && sheet.mode === 'queue') renderQueueList();
}

function extractLink(text) {
  const m = String(text || '').match(/https?:\/\/\S+/);
  return m ? m[0].replace(/[)\].,;]+$/, '') : '';
}

async function pasteQueueUrl() {
  try {
    const t = await navigator.clipboard.readText();
    const link = extractLink(t) || t.trim();
    document.getElementById('q-url').value = link;
    queueState.url = link;
  } catch (_) { toast('Vložte odkaz dlouhým podržením v políčku'); }
}

async function sendQueueItem() {
  const url = extractLink(document.getElementById('q-url').value) || document.getElementById('q-url').value.trim();
  const note = document.getElementById('q-note').value.trim();
  const from = document.getElementById('q-from').value.trim();
  const sec = document.getElementById('q-section').value;
  lsSet(FROM_KEY, from);
  queueState = { ...queueState, url, note, section: sec };
  if (!/^https?:\/\//i.test(url)) { queueState.msg = 'Vložte odkaz na video (začíná https://).'; queueState.msgType = 'err'; renderQueueForm(); return; }
  queueState.sending = true; queueState.msg = ''; renderQueueForm();
  try {
    const res = await fetch(QUEUE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'queue-add', key: QUEUE_KEY, url, note, section: sec, from })
    });
    const data = await res.json();
    if (data.ok) {
      queueState = { ...queueState, url: '', note: '', msg: '✓ Video je ve frontě. Zpracuje se v PC aplikaci.', msgType: 'ok' };
      loadQueueList();
    } else if (data.duplicate === 'archive') {
      queueState.msg = `Tohle video už v archivu je: „${data.title}“${data.presenter ? ' (' + data.presenter + ')' : ''}.`;
      queueState.msgType = 'warn';
    } else if (data.duplicate === 'queue') {
      queueState.msg = 'Tohle video už ve frontě čeká.';
      queueState.msgType = 'warn';
    } else {
      queueState.msg = data.error || 'Nepodařilo se odeslat.';
      queueState.msgType = 'err';
    }
  } catch (e) {
    queueState.msg = 'Nepodařilo se odeslat. Jste připojená k internetu?';
    queueState.msgType = 'err';
  }
  queueState.sending = false;
  renderQueueForm();
}

function renderQueueForm() {
  const el = document.getElementById('sheet');

  const from = lsGet(FROM_KEY) || '';
  el.dataset.drill = '';
  el.innerHTML = `

      <div class="q-label">Odkaz na video (YouTube)</div>

      <div class="q-label">Kdo posílá (nepovinné)</div>
      <input id="q-from" class="q-input" placeholder="např. Jitka" value="${esc(from)}" />
      ${q.msg ? `<div class="q-msg ${q.msgType}">${esc(q.msg)}</div>` : ''}
      <button class="btn btn-blue" style="width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:12px" ${q.sending ? 'disabled' : ''} onclick="sendQueueItem()">${q.sending ? 'Odesílám…' : '📨 Poslat do fronty'}</button>
      <div class="section-h">Čeká na rozbor</div>

      <div class="search-hint" style="margin-top:14px;font-size:12px">Tip pro Android: plánovač přidaný na plochu se objeví i v nabídce „Sdílet“ v aplikaci YouTube.</div>
    </div>`;
  renderQueueList();
}

function renderQueueList() {
  const el = document.getElementById('q-list');
  if (!el) return;
  const q = queueState;
  if (q.listError) { el.innerHTML = `<div class="search-hint">${esc(q.listError)}</div>`; return; }

  if (!q.list.length) { el.innerHTML = `<div class="search-hint">Nic nečeká.</div>`; return; }
  el.innerHTML = q.list.map(it => {
    const d = new Date(it.addedAt);
    const when = isNaN(d) ? '' : `${d.getDate()}. ${d.getMonth() + 1}.`;
    return `<div class="q-item"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a>

  }).join('');
}
