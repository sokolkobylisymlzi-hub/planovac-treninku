function renderSheet() {
  const el = document.getElementById('sheet');
  if (!sheet) return;
  if (sheet.mode === 'queue') { renderQueueForm(); return; }
  if (sheet.mode === 'settings') { renderSettings(); return; }
  if (sheet.mode === 'gen') { renderGen(); return; }
  if (sheet.mode === 'export') { renderExport(); return; }
  const block = sheet.blockId ? getBlk(sheet.blockId) : null;
  if (sheet.mode !== 'shared' && !block) { closeSheetNow(); return; }

  if (sheet.mode === 'pick' && sheet.view === 'list') {
    const q = searchState[block.id] || '';
    el.innerHTML = `
      <div class="sheet-head">
        <button class="icon-btn" onclick="sheetBack()" title="Zpět">←</button>
        <div class="sheet-title">${block.id === ARCH ? '📚 Archiv cvičení' : 'Přidat do: ' + esc(block.name)}<small id="pick-head-sub"></small></div>
        <button class="btn btn-blue" onclick="sheetBack()">Hotovo</button>
      </div>
      <div class="sheet-search">
        <div class="search-input-wrap">
          <input type="search" id="pick-input" class="search-input" enterkeyhint="search" autocomplete="off"
            placeholder="${section==='school' ? 'Hledat: rozcvička, vybíjená, štafeta…' : 'Hledat: rozcvička, křížení, střelba…'}"
            value="${esc(q)}" oninput="onPickSearch(this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" />
          <button class="search-clear" id="pick-clear" onclick="clearPickSearch()" style="display:${q ? 'block' : 'none'}">✕</button>
        </div>
        <div id="pick-chips"></div>
      </div>
      <div class="sheet-body" id="sheet-body"><div id="pick-results"></div></div>`;
    el.dataset.drill = '';
    renderPickParts();
    return;
  }

  const inBlock = block ? block.items.find(i => i.drill.id === sheet.drillId) : null;
  const drill = (sheet.mode === 'item' && inBlock) ? inBlock.drill : drillById[sheet.drillId];
  if (!drill) { closeSheetNow(); return; }
  const id = drill.id;
  const on = markOf(id).fav;
  const sub = [`${drill.durationMinutes || '?'} min`, drill.seminarPresenter].filter(Boolean).map(esc).join(' · ');

  let h = `
    <div class="sheet-head">
      <button class="icon-btn" onclick="sheetBack()" title="Zpět">←</button>
      <div class="sheet-title">${esc(drill.title)}<small>${sub}</small></div>
      <button class="btn btn-surface btn-sm" onclick="shareSingleDrillLink('${jsId(id)}')" title="Poslat cvičení kolegům">📤</button>
      <button class="star-btn ${on ? 'on' : ''}" style="font-size:24px;width:40px;height:40px" onclick="toggleFav('${jsId(id)}')">${on ? '★' : '☆'}</button>
    </div>
    <div class="sheet-body" id="sheet-body">`;

  h += facetLine(drill);
  h += `<div class="detail-sub" style="margin-top:6px">${usageText(id)}</div>`;
  h += videoButton(drill);
  h += renderMobileBoardWidget(drill);

  if (sheet.mode === 'item' && inBlock) {
    const idx = block.items.indexOf(inBlock);
    h += `<div class="item-card">
        <div style="font-size:11px;color:var(--text2);margin-bottom:6px">V tomto tréninku · ${esc(block.name)}</div>
        <div class="drill-item-controls" style="flex-wrap:wrap">
          <input type="number" min="1" max="120" value="${inBlock.duration}"
            onchange="updateDrillDuration('${block.id}','${jsId(id)}',this.value)" /><span>min</span>
          <span style="flex:1"></span>
          <button class="icon-btn" onclick="moveDrill('${block.id}','${jsId(id)}',-1)" ${idx===0?'disabled':''} title="Posunout výš">↑</button>
          <button class="icon-btn" onclick="moveDrill('${block.id}','${jsId(id)}',1)" ${idx===block.items.length-1?'disabled':''} title="Posunout níž">↓</button>
          <button class="btn btn-surface btn-sm" onclick="swapDrill('${block.id}','${jsId(id)}', true)">↻ Vyměnit</button>
          <button class="btn btn-red btn-sm" onclick="removeFromDetail()">Odebrat</button>
        </div>
        <textarea class="drill-note" placeholder="Poznámka k tomuto tréninku…"
          oninput="updateDrillNotes('${block.id}','${jsId(id)}',this.value)">${esc(inBlock.notes || '')}</textarea>
      </div>`;
  }

  h += `<div class="section-h">Popis cvičení</div>` + renderDrillDetail(drill, true);
  h += `<div class="section-h">Moje štítky a poznámka</div>` + tagEditor(id, 'sheet');
  h += markOf(id).hidden
    ? `<div class="hide-box"><div>Tohle cvičení máte v tomto telefonu skryté.</div><button class="btn btn-surface" onclick="unhideDrill('${jsId(id)}')">↩ Znovu nabízet</button></div>`
    : `<div class="hide-box"><div>Nechcete toto cvičení? Skryje se jen v tomto telefonu, v archivu zůstane.</div><button class="btn btn-red" onclick="hideDrill('${jsId(id)}')">🚫 Nenabízet v tomto telefonu</button></div>`;
  h += `</div>`;

  if (sheet.mode === 'pick' && block) {
    const already = block.items.some(i => i.drill.id === id);
    h += `<div class="sheet-foot">${already
      ? `<button class="btn btn-surface" disabled>✓ Už je ${block.id === ARCH ? 'v tréninku' : 'v bloku'}</button>`
      : `<button class="btn btn-blue" onclick="addFromDetail()">＋ ${block.id === ARCH ? 'Přidat do tréninku' : `Přidat do bloku „${esc(block.name)}“`}</button>`}</div>`;
  } else if (sheet.mode === 'shared') {
    h += `<div class="sheet-foot"><button class="btn btn-blue" onclick="addSharedDrillToPlan('${jsId(id)}')">＋ Přidat toto cvičení do mého tréninku</button></div>`;
  }

  const prev = document.getElementById('sheet-body');
  const keep = prev && el.dataset.drill === id ? prev.scrollTop : 0;
  // Běžící video při překreslení nezastavit: přehrávač se přenese do nového obsahu
  const oldFrame = el.dataset.drill === id ? el.querySelector('.video-frame') : null;
  if (oldFrame) oldFrame.remove();
  el.dataset.drill = id;
  el.innerHTML = h;
  const newFrame = el.querySelector('.video-frame');
  if (oldFrame && newFrame && oldFrame.dataset.src === newFrame.dataset.src) newFrame.replaceWith(oldFrame);
  initMobBoardForDrill(drill);
  const body = document.getElementById('sheet-body');
  if (body && keep) body.scrollTop = keep;
}

function hiddenCount() { return Object.values(marks).filter(m => m.hidden).length; }
function toggleShowHidden() { showHidden = !showHidden; render(); }
function hideDrill(id) {

}
function unhideDrill(id) {

}

function facetLine(d) {
  if (!d.facets) return '';
  const parts = [];
  facetVals(d, 'part').forEach(v => parts.push(`<span class="fchip part">${esc(facetLbl('part', v, true))}</span>`));
  facetVals(d, 'topics').forEach(v => parts.push(`<span class="fchip">${esc(facetLbl('topics', v, true))}</span>`));
  facetVals(d, 'posts').forEach(v => parts.push(`<span class="fchip post">${esc(facetLbl('posts', v, true))}</span>`));
  facetVals(d, 'form').forEach(v => parts.push(`<span class="fchip form">${esc(facetLbl('form', v, true))}</span>`));
  facetVals(d, 'u13').forEach(v => { if (v !== 'yes') parts.push(`<span class="fchip u13">U13: ${esc(facetLbl('u13', v))}</span>`); });
  return parts.length ? `<div class="fchips">${parts.join('')}</div>` : '';
}

function renderPickParts() {
  const block = sheet && getBlk(sheet.blockId);
  if (!block) return;
  const q = searchState[block.id] || '';
  const f = filterOf(block.id);
  const myTags = allMyTags();
  const favCount = Object.values(marks).filter(m => m.fav).length;

  const headSub = document.getElementById('pick-head-sub');
  if (headSub) headSub.textContent = block.id === ARCH
    ? `${allDrills.filter(d => d.section === section).length} cvičení · ＋ přidá do tréninku`
    : `${block.items.length} cvičení · ${blockDuration(block)} min`;

  let c = '';
  const facetsOn = sectionHasFacets();
  if (facetsOn) {
    const partDef = facetDefOf('part');
    c += `<div class="chip-row">`;
    c += `<span class="chip filter part ${!f.part ? 'on' : ''}" onclick="setFilter('${block.id}',{part:''})">Vše</span>`;
    partDef.options.forEach(o => {
      c += `<span class="chip filter part ${f.part === o.id ? 'on' : ''}" onclick="setFilterPart('${block.id}','${o.id}')">${esc(o.short || o.label)}</span>`;
    });
    c += `</div>`;
  }
  const extra = extraFilterCount(f);
  c += `<div class="filter-line">

      <span style="flex:1"></span>
      ${extra - (f.fav ? 1 : 0) > 0 ? `<button class="btn btn-surface btn-sm" onclick="clearFilters('${block.id}')">Zrušit filtry</button>` : ''}
      <button class="btn btn-surface btn-sm" onclick="toggleMoreFilters()">${moreFilters ? '▲' : '▼'} Filtry${extra - (f.fav ? 1 : 0) > 0 ? ` (${extra - (f.fav ? 1 : 0)})` : ''}</button>
    </div>`;
  if (moreFilters) {
    c += `<div class="more-filters">`;
    if (facetsOn) {
      ['topics', 'posts', 'form', 'zone', 'u13'].forEach(k => {

        c += `<div class="mf-label">${esc(def.label)}</div><div class="chips" style="margin-top:0">`;
        def.options.forEach(o => {
          const on = (f[k] || []).includes(o.id);
          c += `<span class="chip filter ${on ? 'on' : ''}" onclick="toggleFilterFacet('${block.id}','${k}','${o.id}')">${esc(o.short || o.label)}</span>`;
        });
        c += `</div>`;
      });
    }
    c += `<div class="mf-label">Délka cvičení</div><div class="chips" style="margin-top:0">`;
    DUR_OPTS.forEach(o => {
      c += `<span class="chip filter ${(f.dur || []).includes(o.id) ? 'on' : ''}" onclick="toggleFilterFacet('${block.id}','dur','${o.id}')">${o.label}</span>`;
    });
    c += `</div><div class="mf-label">Kolik mám hráčů (cvičení, které jich potřebuje víc, se skryje)</div><div class="chips" style="margin-top:0">`;
    PLAYER_OPTS.forEach(n => {
      c += `<span class="chip filter ${f.players === n ? 'on' : ''}" onclick="setFilter('${block.id}',{players:${f.players === n ? 0 : n}})">${n === 16 ? '16+' : n}</span>`;
    });
    c += `</div><div class="mf-label">Tuhle pomůcku nemám (cvičení s ní se skryjí)</div><div class="chips" style="margin-top:0">`;
    EQUIP_GROUPS.forEach(g => {
      c += `<span class="chip filter ${(f.noEquip || []).includes(g.id) ? 'on' : ''}" onclick="toggleFilterFacet('${block.id}','noEquip','${g.id}')">${(f.noEquip || []).includes(g.id) ? '🚫 ' : ''}${g.label}</span>`;
    });
    c += `</div>`;
    if (myTags.length) {
      c += `<div class="mf-label">Moje štítky</div><div class="chips" style="margin-top:0">`;
      myTags.forEach(t => {
        c += `<span class="chip filter ${f.tag === t ? 'on' : ''}" onclick="toggleFilterTag('${block.id}','${jsStr(t)}')">🏷 ${esc(t)}</span>`;
      });
      c += `</div>`;
    }
    const hc = hiddenCount();
    if (hc) {
      c += `<div class="mf-label">Skrytá cvičení</div><div class="chips" style="margin-top:0">
        <span class="chip filter ${showHidden ? 'on' : ''}" onclick="toggleShowHidden()">🚫 Zobrazit skrytá (${hc})</span></div>`;
    }
    c += `</div>`;
  }
  const chipsEl = document.getElementById('pick-chips');
  if (chipsEl) chipsEl.innerHTML = c;

  const results = searchDrills(q, block);
  const used = new Set(block.items.map(i => i.drill.id));
  const words = normalize(q.trim()).split(/\s+/).filter(w => w.length > 1);
  let h = `<div class="pick-count">${words.length ? `Nalezeno: ${results.length}` : `${results.length} cvičení`} · klepněte na název pro popis a video</div>`;
  if (!results.length) {
    h += `<div class="search-hint" style="padding:16px 2px">Nic nenalezeno. Zkuste jiné slovo.</div>`;
  }
  results.forEach(d => {
    const isUsed = used.has(d.id);
    const sub = [`${d.durationMinutes || '?'} min`, d.seminarPresenter].filter(Boolean).map(esc).join(' · ');
    h += `
      <div class="pick-item${markOf(d.id).hidden ? ' is-hidden' : ''}">
        ${starBtn(d.id)}
        <div class="pick-main" onclick="openPickDetail('${jsId(d.id)}')">
          <div class="result-title">${esc(d.title)}</div>
          <div class="result-sub">${sub}${videoLink(d) ? ' · <span class="vid-mark">▶</span>' : ''}</div>
          ${facetLine(d)}
          <div class="result-sub">${markOf(d.id).hidden ? '<span style="color:#fca5a5">🚫 skryté</span> · ' : ''}${usageText(d.id)}</div>
          ${tagChips(d.id)}
        </div>
        ${isUsed
          ? `<button class="add-btn done" disabled title="Už je v bloku">✓</button>`
          : `<button class="add-btn" onclick="quickAdd('${jsId(d.id)}')" title="Přidat do bloku">＋</button>`}
      </div>`;
  });
  const resEl = document.getElementById('pick-results');
  if (resEl) resEl.innerHTML = h;
}

function renderDrillDetail(drill, inSheet) {
  let h = `<div class="drill-detail">`;
  if (drill.coachNote && String(drill.coachNote).trim()) {
    h += `<div class="drill-desc-section" style="background:rgba(245,158,11,0.14);border:1px solid rgba(245,158,11,0.4);padding:8px 10px;border-radius:8px;margin-bottom:8px;color:#fde68a;"><div class="drill-desc-label" style="color:#fbbf24">📝 Poznámka a pokyn trenéra</div>${esc(drill.coachNote)}</div>`;
  }
  if (drill.objective) h += `<div class="drill-desc-section"><div class="drill-desc-label tag">Cíl</div>${esc(drill.objective)}</div>`;
  if (drill.organization) h += `<div class="drill-desc-section"><div class="drill-desc-label" style="color:#94a3b8">Organizace</div>${esc(drill.organization)}</div>`;
  const list = (items, label, cls, style, ordered) => {
    if (!items || !items.length) return '';
    const tag = ordered ? 'ol' : 'ul';
    return `<div class="drill-desc-section"><div class="drill-desc-label ${cls}" ${style ? `style="${style}"` : ''}>${label}</div><${tag} class="drill-desc-list">${items.map(k => `<li>${esc(k)}</li>`).join('')}</${tag}></div>`;
  };
  h += list(drill.execution, 'Průběh', 'tag-info', '', true);
  h += list(drill.coachingPoints, 'Klíčové pokyny', '', 'color:#fbbf24', false);
  h += list(drill.commonMistakes, 'Časté chyby', 'tag-warn', '', false);
  h += list(drill.progressions, 'Varianty', '', 'color:#c4b5fd', false);
  const meta = [drill.playerCount, drill.courtZone, ...(drill.equipment||[])].filter(Boolean);
  if (meta.length) h += `<div style="margin-top:6px;padding-top:6px;border-top:1px solid #334155;font-size:11px;color:#64748b">${meta.map(esc).join(' · ')}</div>`;
  if (drill.seminarTitle) h += `<div style="margin-top:4px;font-size:11px;color:#64748b">Seminář: ${esc(drill.seminarTitle)}</div>`;
  const note = markOf(drill.id).note;
  if (!inSheet && note && note.trim()) h += `<div class="drill-desc-section"><div class="drill-desc-label" style="color:#fbbf24">Moje poznámka</div>${esc(note)}</div>`;
  h += `</div>`;
  return h;
}

function openMenu() {
  const favs = Object.values(marks).filter(m => m.fav).length;
  const tagged = Object.values(marks).filter(m => (m.tags || []).length).length;
  const date = dataInfo && dataInfo.updatedAt ? new Date(dataInfo.updatedAt).toLocaleString('cs') : '–';
  document.getElementById('menu-main').style.display = 'block';
  document.getElementById('menu-lib').style.display = 'none';
  document.getElementById('lib-count').textContent = (cloudPlans.length || library.length)
    ? `${cloudPlans.length} na Disku · ${library.length} v telefonu – otevřít, upravit`
    : 'Zatím žádný uložený trénink';
  document.getElementById('menu-info').textContent =
    `${favs} oblíbených · ${tagged} cvičení se štítky · ${hiddenCount()} skrytých · archiv z ${date}${dataInfo && dataInfo.fromCache ? ' (offline)' : ''}`;
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu() { document.getElementById('menu-overlay').classList.remove('show'); }

function planAsText() {
  const fmt = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  let t = 0;
  const total = blocks.reduce((s, b) => s + blockDuration(b), 0);
  let out = `${(meta.name || '').trim() || defaultName()}${meta.date ? ' – ' + fmtDate(meta.date) : ''} (${total} min)\n`;
  blocks.forEach(b => {
    const d = blockDuration(b);
    out += `\n${fmt(t)}–${fmt(t + d)}  ${b.name} (${d} min)\n`;
    b.items.forEach(it => {
      out += `  • ${it.drill.title} – ${it.duration} min\n`;
      if (it.notes && it.notes.trim()) out += `    ${it.notes.trim()}\n`;
    });
    t += d;
  });
  return out;
}

async function sharePlanText() {
  closeMenu();
  if (!blocks.length) { toast('Plán je prázdný'); return; }
  const text = planAsText();
  try {
    if (navigator.share) { await navigator.share({ title: 'Plán tréninku', text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('✓ Plán zkopírován do schránky'); }
  catch (_) { prompt('Zkopírujte plán:', text); }
}

async function backupMyData() {
  closeMenu();
  const payload = { app: 'planovac-treninku', version: 2, savedAt: Date.now(), marks, plan: blocks, meta, library, section, rules };
  const json = JSON.stringify(payload);
  const name = `planovac-zaloha-${new Date().toISOString().slice(0,10)}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Záloha plánovače' });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('✓ Záloha stažena');
}

function restoreMyData(input) {
  closeMenu();
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.app !== 'planovac-treninku') throw new Error('Tohle není záloha plánovače');
      const replacePlan = !blocks.length || confirm('Nahradit současný plán plánem ze zálohy?\n(Oblíbené a štítky se sloučí vždy.)');
      // Značky sloučit: štítky spojit, oblíbené zachovat, poznámku ze zálohy použít, když tu žádná není
      Object.entries(data.marks || {}).forEach(([id, m]) => {
        const cur = markOf(id);
        marks[id] = {
          fav: !!(cur.fav || m.fav),
          hidden: !!(cur.hidden || m.hidden),
          tags: [...new Set([...(cur.tags || []), ...(m.tags || [])])],
          note: (cur.note && cur.note.trim()) ? cur.note : (m.note || '')
        };
      });
      saveMarks();
      // Uložené tréninky sloučit podle ID (novější verze vyhrává)
      let added = 0;
      (Array.isArray(data.library) ? data.library : []).forEach(t => {
        if (!t || !t.id) return;
        const i = library.findIndex(x => x.id === t.id);
        if (i < 0) { library.push(t); added++; }
        else if ((t.savedAt || 0) > (library[i].savedAt || 0)) library[i] = t;
      });
      saveLibrary();
      if (data.rules && typeof data.rules === 'object' && confirm('Záloha obsahuje i Nastavení tréninků (dny, kategorie, pravidla). Použít je?')) {
        rules = mergeRules(data.rules);
        saveRules();
      }
      if (replacePlan && Array.isArray(data.plan)) {
        blocks = data.plan;
        refreshDrills(blocks);
        meta = { libId: null, name: '', date: todayStr(), dirty: true, ...(data.meta || {}) };
        if (meta.libId && !library.some(t => t.id === meta.libId)) meta.libId = null;
        saveMeta();
        savePlan(false);
      }
      render();
      toast(`✓ Záloha obnovena${added ? ` · ${added} tréninků přidáno` : ''}`);
    } catch (e) {
      alert('Zálohu se nepodařilo načíst: ' + e.message);
    }
  };
  reader.readAsText(file);
}

function setTab(t) {
  tab = t;
  lsSet(TAB_KEY, t);
  updateNav();
  if (t === 'hala') keepAwake(true); else keepAwake(false);
  render();
  document.getElementById('main').scrollTop = 0;
}
function updateNav() {
  ['plan', 'trenink', 'hala', 'archiv'].forEach(t => {
    const b = document.getElementById('nav-' + t);
    if (b) b.className = t === tab ? 'on' : '';
  });
}
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && tab === 'hala') keepAwake(true); });

// Všechny tréninky pro kalendář: v telefonu + na Disku (bez dvojic)
function allPlans() {
  const map = new Map();
  cloudPlans.forEach(p => map.set(p.id, { ...p, where: 'cloud' }));
  library.forEach(p => map.set(p.id, { ...p, where: map.has(p.id) ? 'both' : 'local' }));
  return [...map.values()].filter(p => p.date);
}
function plansOn(date) {
  return allPlans().filter(p => p.date === date)
    .sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
function addDays(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
const DOW = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
function dowOf(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getDay(); }
function dayLabel(s) {
  const t = todayStr();
  const pre = s === t ? 'Dnes · ' : s === addDays(t, 1) ? 'Zítra · ' : '';
  return `${pre}${DOW[dowOf(s)]} ${fmtDate(s)}`;
}
function endTime(time, min) {
  if (!time || min == null || min === '') return '';
  const [h, m] = time.split(':').map(Number);
  const e = h * 60 + m + min;
  return `${Math.floor(e / 60) % 24}:${String(e % 60).padStart(2, '0')}`;
}
function planLen(p) { return Number(p.target) || planMinutes(p.blocks || []) || 0; }

function calShift(n) {
  const [y, m] = calMonth.split('-').map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  calMonth = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
  render();
}
function calToday() { calSel = todayStr(); calMonth = calSel.slice(0, 7); planForm = null; render(); }
function calPick(s) { calSel = s; if (s.slice(0, 7) !== calMonth) calMonth = s.slice(0, 7); if (planForm) planForm.date = s; render(); }

function planCard(p) {
  const drills = (p.blocks || []).reduce((s, b) => s + (b.items || []).length, 0);
  const len = planLen(p);
  const empty = !drills;
  const cur = p.id === meta.libId;
  const where = p.where === 'local' ? '📱 v telefonu' : p.where === 'cloud' ? '☁️ na Disku' : '📱 + ☁️';
  const end = endTime(p.time, len);
  return `<div class="plan-card ${empty ? 'empty' : ''} ${cur ? 'current' : ''}">
      <div class="pc-top">
        <span class="pc-time">${esc(p.time || '–:–')}${end ? `<small style="color:var(--text2);font-weight:400">–${end}</small>` : ''}</span>
        <span class="pc-name">${esc(p.name)}</span>
      </div>
      <div class="pc-sub">${p.focus ? `🎯 ${esc(p.focus)} · ` : ''}${!empty && p.target && planMinutes(p.blocks || []) !== +p.target ? `${planMinutes(p.blocks || [])}/${p.target} min · ` : len ? len + ' min · ' : ''}${empty ? '<span style="color:#fbbf24">bez cvičení</span>' : `${(p.blocks || []).length} bloků · ${drills} cvičení`} · ${where}</div>
      <div class="pc-btns">
        <button class="btn btn-blue" onclick="openFromPlan('${jsStr(p.id)}','${p.where}')">${empty ? '🧩 Složit trénink' : '📂 Otevřít'}</button>
        ${empty ? '' : `<button class="btn btn-surface" onclick="openFromPlan('${jsStr(p.id)}','${p.where}', true)">🏟️ Hala</button>`}
        <button class="btn btn-surface" onclick="movePlanForm('${jsStr(p.id)}')">🕑 Přesunout</button>
        <button class="btn btn-red" onclick="deletePlan('${jsStr(p.id)}','${p.where}')">Smazat</button>
      </div>
    </div>`;
}

function renderPlan() {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const startOffset = (first.getDay() + 6) % 7; // pondělí první
  const startStr = addDays(`${calMonth}-01`, -startOffset);
  const today = todayStr();
  const byDate = {};
  allPlans().forEach(p => { (byDate[p.date] = byDate[p.date] || []).push(p); });
  const monthName = first.toLocaleDateString('cs', { month: 'long', year: 'numeric' });

  let h = `<div class="cal-head">
      <button class="icon-btn" style="font-size:22px" onclick="calShift(-1)" title="Předchozí měsíc">‹</button>
      <h2>${esc(monthName)}</h2>
      <button class="btn btn-surface btn-sm" onclick="calToday()">Dnes</button>
      <button class="icon-btn" style="font-size:22px" onclick="calShift(1)" title="Další měsíc">›</button>
    </div>
    <div class="cal-grid">${['Po','Út','St','Čt','Pá','So','Ne'].map(d => `<div class="cal-dow">${d}</div>`).join('')}`;
  for (let i = 0; i < 42; i++) {
    const s = addDays(startStr, i);
    if (i >= 35 && s.slice(0, 7) !== calMonth) break;
    const list = byDate[s] || [];
    const cls = ['cal-day', s.slice(0, 7) !== calMonth ? 'out' : '', s === today ? 'today' : '', s === calSel ? 'sel' : ''].join(' ');
    const dots = list.slice(0, 3).map(p => `<span class="dot ${(p.blocks || []).some(b => (b.items || []).length) ? '' : 'empty'}"></span>`).join('');
    h += `<div class="${cls}" onclick="calPick('${s}')">${+s.slice(8)}<div class="dots">${dots}</div></div>`;
  }
  h += `</div>`;

  if (planForm) h += renderPlanForm();

  const dayList = plansOn(calSel);
  h += `<div class="day-title"><span>${esc(dayLabel(calSel))}</span>
      ${planForm ? '' : `<button class="btn btn-blue btn-sm" onclick="openPlanForm()">＋ Naplánovat</button>`}</div>`;
  if (!dayList.length) {
    h += `<div class="muted-box">Na tento den nic naplánováno.${planForm ? '' : ' Klepněte na <b>＋ Naplánovat</b>.'}</div>`;
  } else {
    dayList.forEach(p => { h += planCard(p); });
  }

  const upcoming = allPlans().filter(p => p.date >= today && p.date !== calSel)
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).slice(0, 6);
  if (upcoming.length) {
    h += `<div class="day-title" style="margin-top:16px"><span>Nejbližší tréninky</span></div>`;
    let lastDate = '';
    upcoming.forEach(p => {
      if (p.date !== lastDate) { h += `<div style="font-size:12px;color:#93c5fd;margin:6px 0 4px;font-weight:700;cursor:pointer" onclick="calPick('${p.date}')">${esc(dayLabel(p.date))}</div>`; lastDate = p.date; }
      h += planCard(p);
    });
  }
  h += `<div class="muted-box" style="margin-top:14px">Režim host: naplánované tréninky jsou jen v tomto telefonu. Tlačítko 💾 Uložit v Tréninku je pošle i na sdílený Disk. Napojení na kalendář kategorie v KOby Coach přijde později.</div>`;
  return h;
}

function lastPlanDefaults() {
  const p = [...library].filter(x => x.time).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))[0];
  return { time: p ? p.time : '17:00', target: p && p.target ? p.target : 90 };
}
function openPlanForm() {
  const d = lastPlanDefaults();

  const day = (rules.days || []).find(x => x.dow === dowOf(calSel));
  planForm = { mode: 'new', date: calSel, time: (day && day.time) || d.time, target: (day && day.minutes) || d.target, focus: '', name: '', repeat: '', until: '' };

}
function movePlanForm(id) {
  if (meta.libId === id && meta.dirty) saveTraining(true);
  const p = allPlans().find(x => x.id === id);
  if (!p) return;
  planForm = { mode: 'move', id, where: p.where, date: p.date, time: p.time || '', target: p.target || planLen(p) || 90, focus: p.focus || '', name: p.name, repeat: '', until: '' };

function setPF(k, v) { if (planForm) planForm[k] = v; if (k === 'repeat') render(); }
function closePlanForm() { planForm = null; render(); }
function renderPlanForm() {
  const f = planForm;
  const seasonEnd = (() => { const t = todayStr(); const y = +t.slice(0, 4) + (+t.slice(5, 7) >= 7 ? 1 : 0); return `${y}-06-30`; })();
  return `<div class="form-card">

          <select onchange="setPF('repeat', this.value)">
            <option value="" ${!f.repeat ? 'selected' : ''}>Jen tento den</option>
            <option value="w4" ${f.repeat === 'w4' ? 'selected' : ''}>Každý týden, 4 týdny</option>
            <option value="w8" ${f.repeat === 'w8' ? 'selected' : ''}>Každý týden, 8 týdnů</option>
            <option value="until" ${f.repeat === 'until' ? 'selected' : ''}>Každý týden do data…</option>
          </select></div>
          ${f.repeat === 'until' ? `<div class="full"><label>Do (konec sezóny je ${fmtDate(seasonEnd)})</label><input type="date" value="${esc(f.until || seasonEnd)}" onchange="setPF('until', this.value)" /></div>` : ''}` : ''}
      </div>

        <button class="btn btn-blue" onclick="submitPlanForm(true)">Složit trénink ›</button>`
        : `<button class="btn btn-blue" onclick="submitPlanForm(false)">Uložit změnu</button>`}
      </div>

}
function submitPlanForm(compose) {
  const f = planForm;
  if (!f || !f.date) { toast('Vyberte den'); return; }
  if (f.mode === 'move') {
    if (meta.libId === f.id && meta.dirty) saveTraining(true);
    let p = library.find(x => x.id === f.id);
    if (!p) { // trénink jen na Disku: vezme se do telefonu
      const c = cloudPlans.find(x => x.id === f.id);
      if (!c) return;
      p = JSON.parse(JSON.stringify(c)); library.unshift(p);
    }
    Object.assign(p, { date: f.date, time: f.time, target: f.target, focus: f.focus, name: (f.name || '').trim() || p.name, savedAt: Date.now() });
    saveLibrary();
    if (meta.libId === p.id) { Object.assign(meta, { date: p.date, time: p.time, target: p.target, focus: p.focus, name: p.name }); saveMeta(); }
    if (f.where !== 'local') syncPlanToCloud(p);
    planForm = null; calSel = f.date; calMonth = f.date.slice(0, 7);
    render();
    toast('✓ Trénink přesunut');
    return;
  }
  const dates = [f.date];
  const weeks = f.repeat === 'w4' ? 4 : f.repeat === 'w8' ? 8 : 0;
  for (let i = 1; i < weeks; i++) dates.push(addDays(f.date, 7 * i));
  if (f.repeat === 'until') {
    const until = f.until || '';
    for (let d = addDays(f.date, 7); until && d <= until && dates.length < 60; d = addDays(d, 7)) dates.push(d);
  }
  const now = Date.now();
  const made = dates.map((d, i) => ({
    id: 'plan-' + (now + i),
    name: (f.name || '').trim() || ('Trénink ' + fmtDate(d)),
    date: d, time: f.time, target: f.target, focus: f.focus,
    ageCategory: '', section, blocks: [], savedAt: now + i
  }));
  library.unshift(...made);
  saveLibrary();
  planForm = null;
  calSel = made[0].date; calMonth = calSel.slice(0, 7);
  if (compose) { openTraining(made[0].id, false, false); toast('🧩 Teď přidejte bloky a cvičení'); return; }
  render();
  toast(made.length > 1 ? `✓ Naplánováno ${made.length}× (každý týden)` : '✓ Naplánováno');
}
async function deletePlan(id, where) {
  const p = allPlans().find(x => x.id === id);
  if (!p) return;
  const txt = where === 'local' ? 'z tohoto telefonu' : where === 'cloud' ? 'ze sdíleného Disku (zmizí i v PC)' : 'z telefonu i ze sdíleného Disku (zmizí i v PC)';
  if (!confirm(`Smazat trénink „${p.name}“ ${txt}?`)) return;
  if (where !== 'cloud') {
    library = library.filter(x => x.id !== id);
    saveLibrary();
  }
  if (meta.libId === id) { meta.libId = null; meta.dirty = blocks.length > 0; saveMeta(); }
  if (where !== 'local') {
    const remaining = cloudPlans.filter(x => x.id !== id);
    try {
      const res = await fetch(QUEUE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'plans-save', key: QUEUE_KEY, plans: remaining.map(toCloudPlanPayload) })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || 'HTTP ' + res.status);
      cloudPlans = remaining;
      saveCloudPlansCache();
    } catch (_) {
      render();
      toast('⚠️ Z Disku se smazat nepodařilo (offline?) – zkuste znovu');
      return;
    }
  }
  render();
  toast('🗑️ Smazáno');
}
function openFromPlan(id, where, toHala) {
  const fromCloud = where === 'cloud';
  if (meta.libId !== id) openTraining(id, false, fromCloud);
  if (toHala) { halaIdx = 0; setTab('hala'); }
  else setTab('trenink');
}

// ── Pomůcky z vybraných cvičení ────────────────────────────────────────────
function equipList(bl) {
  const seen = new Map();
  bl.forEach(b => (b.items || []).forEach(it => (it.drill.equipment || []).forEach(e => {
    const n = normalize(String(e).trim());
    if (/^(zadn|bez pomuc)|brankar/.test(n)) return; // „žádné“ ani brankář nejsou pomůcky
    // Stejné pomůcky psané různě („míč“, „Házenkářské míče (1 na hráče)“) sloučit pod jeden název
    const g = EQUIP_GROUPS.find(x => x.re.test(n));
    const k = g ? g.id : n.replace(/y$|e$|i$/, '');
    if (k && !seen.has(k)) seen.set(k, g ? g.label : String(e).trim());
  })));
  return [...seen.values()];
}
function equipBox() {
  const list = equipList(blocks);
  if (!list.length) return '';
  return `<div class="equip-box"><b>🧺 Pomůcky na trénink</b>${list.map(esc).join(' · ')}</div>`;
}

// ── Hala: jedno cvičení po druhém, velké písmo ─────────────────────────────
function halaItems() {
  const out = [];
  let t = 0;
  blocks.forEach(b => {
    if (!b.items.length) { t += blockDuration(b); return; }
    b.items.forEach(it => { out.push({ block: b, it, start: t }); t += it.duration; });
  });
  return out;
}
function halaGo(n) {
  const list = halaItems();
  halaIdx = Math.max(0, Math.min(list.length - 1, halaIdx + n));
  render();
  document.getElementById('main').scrollTop = 0;
}
function halaFull() {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  } catch (_) {}
}
function renderHala() {
  const list = halaItems();
  if (!list.length) {
    return `<div class="empty-state"><div class="icon">🏟️</div><h2>Hala je prázdná</h2>
      <p>Otevřete trénink v Plánu nebo ho složte v Tréninku. V Hale se pak ukazuje jedno cvičení po druhém velkým písmem.</p>
      <p style="margin-top:14px"><button class="btn btn-blue" onclick="setTab('plan')">📅 Do Plánu</button></p></div>`;
  }
  if (halaIdx >= list.length) halaIdx = list.length - 1;
  const cur = list[halaIdx];
  const d = cur.it.drill;
  const fmt = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  const total = blocks.reduce((s, b) => s + blockDuration(b), 0);
  const clock = meta.time ? endTime(meta.time, cur.start) : '';
  let h = `<div class="hala-top">
      <div class="ht"><b>${esc((meta.name || '').trim() || defaultName())}</b>${meta.time ? esc(meta.time) + ' · ' : ''}${total} min · ${halaIdx + 1}/${list.length}</div>
      <button class="btn btn-surface btn-sm" onclick="halaFull()" title="Celá obrazovka">⛶</button>
    </div>
    <div class="hala-prog">${list.map((_, i) => `<i class="${i < halaIdx ? 'done' : i === halaIdx ? 'now' : ''}"></i>`).join('')}</div>
    <div class="hala-card">
      <div class="hala-block">${esc(cur.block.name)} · ${clock ? clock : fmt(cur.start)}</div>
      <div class="hala-title">${esc(d.title)}</div>
      <div class="hala-min">${cur.it.duration}<small> min</small></div>`;
  if ((cur.it.notes || '').trim()) h += `<div class="hala-note">📝 ${esc(cur.it.notes)}</div>`;
  if (d.organization) h += `<div class="hala-sec"><div class="lbl">Organizace</div>${esc(d.organization)}</div>`;
  if ((d.execution || []).length) h += `<div class="hala-sec"><div class="lbl">Průběh</div><ol>${d.execution.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  if ((d.coachingPoints || []).length) h += `<div class="hala-sec"><div class="lbl" style="color:#fbbf24">Klíčové pokyny</div><ul>${d.coachingPoints.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  const eq = [d.playerCount, ...(d.equipment || [])].filter(Boolean);
  if (eq.length) h += `<div class="hala-sec" style="font-size:15px;color:var(--text2)">${eq.map(esc).join(' · ')}</div>`;
  h += `<div style="margin-top:12px"><button class="btn btn-surface" onclick="openItem('${cur.block.id}','${jsId(d.id)}')">▶ Video a celý popis</button></div>`;
  h += `</div>
    <div class="hala-nav">
      <button class="btn btn-surface" onclick="halaGo(-1)" ${halaIdx === 0 ? 'disabled' : ''}>‹ Předchozí</button>
      <button class="btn btn-blue" onclick="halaGo(1)" ${halaIdx === list.length - 1 ? 'disabled' : ''}>Další ›</button>
    </div>`;
  const next = list[halaIdx + 1];
  if (next) h += `<div class="muted-box" style="margin-top:10px">Potom: <b>${esc(next.it.drill.title)}</b> · ${next.it.duration} min</div>`;
  const eqAll = equipList(blocks);
  if (eqAll.length) h += `<div class="equip-box" style="margin-top:10px"><b>🧺 Pomůcky na celý trénink</b>${eqAll.map(esc).join(' · ')}</div>`;
  return h;
}

// ── Archiv: přehled a procházení ───────────────────────────────────────────
const PART_BLOCK = { warmup: 'Rozcvička', technique: 'Průprava', main: 'Hlavní část', game: 'Hra', fitness: 'Kondice', cooldown: 'Závěr' };
const PART_ORDER = ['warmup', 'technique', 'main', 'game', 'fitness', 'cooldown'];
function renderArchiv() {

      <button class="btn btn-surface btn-sm" style="margin-left:6px" onclick="reloadDrills()">🔄 Načíst nové</button></div>

    partDef.options.forEach(o => {

    });
    h += `</div>`;
  }
  h += `<div class="muted-box">＋ u cvičení ho přidá do <b>otevřeného tréninku</b> (${esc((meta.name || '').trim() || defaultName())}), do bloku podle části (rozcvička, hlavní část…). Když blok chybí, založí se. Trénink pak uložte tlačítkem 💾 Uložit v záložce Trénink.</div>`;

function openArchive(part) {
  filterState[ARCH] = startFilter(part);
  sheet = { mode: 'pick', blockId: ARCH, view: 'list', drillId: null, scroll: 0 };
  history.pushState({ sheet: 1 }, '');
  renderSheet();
  showSheet();
}
function addFromArchive(drillId) {
  const d = drillById[drillId];
  if (!d) return;
  if (blocks.some(b => b.items.some(i => i.drill.id === drillId))) { toast('Cvičení už v tréninku je'); return; }
  const part = facetVals(d, 'part')[0] || '';
  let b = part ? blocks.find(x => guessPart(x.name) === part) : null;
  if (!b) b = blocks.find(x => !x.items.length && !guessPart(x.name));
  if (!b) {
    if (part && PART_BLOCK[part]) {
      b = { id: uid(), name: PART_BLOCK[part], plannedMinutes: 15, items: [] };
      const ord = PART_ORDER.indexOf(part);
      const at = blocks.findIndex(x => { const p = guessPart(x.name); return p && PART_ORDER.indexOf(p) > ord; });
      if (at < 0) blocks.push(b); else blocks.splice(at, 0, b);
    } else if (blocks.length) {
      b = blocks[blocks.length - 1];
    } else {
      b = { id: uid(), name: 'Hlavní část', plannedMinutes: 15, items: [] };
      blocks.push(b);
    }
  }
  b.items.push({ drill: d, duration: d.durationMinutes || 10, notes: '' });
  savePlan();
  render();
  toast(`✓ Přidáno do „${b.name}“`);
}

// ═══════════════════════════════════════════════════════════════════════════
// Nastavení tréninků a generátor
// Pravidla si nastaví každý trenér sám (kategorie, dny, typy tréninku).
// Výchozí hodnoty vycházejí z metodiky U13 (norský a dánský přístup):
// rozcvička → nová látka od jednoduchého ke hře → herní forma na konci.
// Generátor jen vybírá z archivu podle pravidel, nic si nevymýšlí.
// ═══════════════════════════════════════════════════════════════════════════
const RULES_KEY = 'koby_rules_v1';
const CATS = [
  { id: 'U9',      fit: ['yes'] },
  { id: 'U11',     fit: ['yes'] },
  { id: 'U13',     fit: ['yes', 'adapt'] },
  { id: 'U15',     fit: ['yes', 'adapt', 'older'] },
  { id: 'U17',     fit: ['yes', 'adapt', 'older'] },
  { id: 'Dospělí', fit: ['yes', 'adapt', 'older'] }
];
const TOPIC_MODES = [
  { id: 'theme', label: 'Téma tréninku' },
  { id: 'last',  label: 'Téma minulého tréninku' },
  { id: 'any',   label: 'Libovolné' },
  { id: 'fixed', label: 'Vybraná témata' }
];
const DOW_SHORT = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
const FORM_RANK = { individual: 0, pairs: 1, small: 2, team: 3 };
const PART_RANK = { warmup: 0, technique: 1, fitness: 1, main: 2, game: 3, cooldown: 4 };
// Fáze nácviku: izolovaně → s odporem v malých skupinách → herní forma
const STAGES = [
  { share: 0.35, ok: d => ['individual', 'pairs'].includes(facetVals(d, 'form')[0]) },
  { share: 0.35, ok: d => facetVals(d, 'form')[0] === 'small' },
  { share: 0.30, ok: d => facetVals(d, 'form')[0] === 'team' || facetVals(d, 'part').includes('game') }
];

function tb(name, minutes, parts, topic, topics, prog, forms) { return { name, minutes, parts, topic, topics: topics || [], prog: !!prog, forms: forms || [] }; }
function defaultTemplates() {
  return [
    { id: 'new', name: 'Nová látka + hra', blocks: [
      tb('Rozcvička', 30, ['warmup'], 'any'),
      tb('Hlavní část – nácvik', 50, ['technique', 'main'], 'theme', [], true),
      tb('Hry', 10, ['game'], 'theme')
    ] },
    { id: 'versatile', name: 'Všestrannost a technika', blocks: [
      tb('Rozcvička', 15, ['warmup'], 'any'),
      tb('Stanoviště – obratnost a kondice', 20, ['fitness', 'warmup', 'technique'], 'fixed', ['coordination']),
      tb('Stanoviště – míčová technika', 20, ['technique'], 'fixed', ['passing', '1v1']),
      tb('Hlavní část', 25, ['technique', 'main'], 'theme', [], true),
      tb('Závěr', 10, ['game', 'cooldown'], 'any')
    ] },
    { id: 'repeat', name: 'Opakování ve hře', blocks: [
      tb('Rozcvička – rychlý útok', 20, ['warmup', 'technique', 'main'], 'fixed', ['fastbreak']),
      tb('Hlavní část – téma v herní variantě', 45, ['main', 'game'], 'last', [], true, ['small', 'team']),
      tb('Závěr – hra', 25, ['game'], 'any')
    ] }
  ];
}
function defaultRules() {
  return {
    category: 'U13', fit: ['yes', 'adapt'], players: 12, missingEquip: [],
    preferFav: true, preferUnused: true, checks: true,
    days: [
      { dow: 2, time: '17:00', minutes: 90, tpl: 'new' },
      { dow: 3, time: '17:00', minutes: 90, tpl: 'versatile' },
      { dow: 4, time: '17:00', minutes: 90, tpl: 'repeat' }
    ],
    templates: defaultTemplates()
  };
}
function mergeRules(r) {
  const base = defaultRules();
  const out = { ...base, ...(r || {}) };
  if (!Array.isArray(out.templates) || !out.templates.length) out.templates = base.templates;
  if (!Array.isArray(out.days)) out.days = [];
  if (!Array.isArray(out.fit) || !out.fit.length) out.fit = base.fit;
  if (!Array.isArray(out.missingEquip)) out.missingEquip = [];
  return out;
}
let rules = defaultRules();
function loadRules() { try { rules = mergeRules(JSON.parse(lsGet(RULES_KEY) || 'null')); } catch (_) { rules = defaultRules(); } }
function saveRules() { lsSet(RULES_KEY, JSON.stringify(rules)); }
function tplById(id) { return rules.templates.find(t => t.id === id) || rules.templates[0]; }

// ── Téma: pozná se i z ručně psaného zaměření („rychlý útok“ → Rychlý útok) ──
function topicOptions() { const d = facetDefOf('topics'); return d ? d.options : []; }
function themesFromText(txt) {
  const n = normalize(txt);
  if (!n) return [];
  const out = topicOptions().filter(o => [o.label, o.short].filter(Boolean)
    .some(l => { const k = normalize(l).replace(/\s*\(.*\)\s*$/, ''); return k && n.includes(k); }))
    .map(o => o.id);
  if (n.includes('kondic') && !out.includes('part:fitness')) out.push('part:fitness');
  return out;
}
function themeLbl(id) { return id === 'part:fitness' ? 'Kondice' : facetLbl('topics', id); }
function themeFromText(txt) { return themesFromText(txt)[0] || ''; }
function lastTheme(beforeDate) {
  const list = allPlans().filter(p => p.date && p.date < beforeDate && p.id !== meta.libId)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  for (const p of list) { const t = themeFromText(p.focus); if (t) return t; }
  return '';
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

// ── Výběr cvičení ──────────────────────────────────────────────────────────
function fitsRules(d, players) {
  if (d.section !== section || markOf(d.id).hidden) return false;
  const u = facetVals(d, 'u13');
  if (u.length && !u.some(v => rules.fit.includes(v))) return false;
  if (players && drillMinPlayers(d) > players) return false;
  if (drillEquipGroups(d).some(g => (rules.missingEquip || []).includes(g))) return false;
  return true;
}
function resolveTopics(spec, ctx) {
  const th = Array.isArray(ctx.themes) ? ctx.themes : (ctx.theme ? [ctx.theme] : []);
  if (spec.topic === 'theme') return th;
  if (spec.topic === 'last') return ctx.lastTheme ? [ctx.lastTheme] : th;
  if (spec.topic === 'fixed') return spec.topics || [];
  return [];
}
// Pořadí kandidátů: nejdřív na téma, pak body za oblíbené / dlouho nepoužité.
// Malá náhoda, aby „Vygenerovat znovu“ dalo jiný, ale pořád vhodný výběr.
function rankDrills(spec, topics, ctx) {
  const hasFit = topics.includes('part:fitness');
  const posts = ctx.posts || [];
  const forms = ctx.forms || [];
  return allDrills
    .filter(d => !ctx.used.has(d.id)
      && ((spec.parts || []).some(p => facetVals(d, 'part').includes(p)) || (hasFit && facetVals(d, 'part').includes('fitness')))
      && fitsRules(d, ctx.players)
      && (!(spec.forms || []).length || spec.forms.includes(facetVals(d, 'form')[0])))
    .map(d => {
      const matchTopic = facetVals(d, 'topics').some(t => topics.includes(t)) || (hasFit && facetVals(d, 'part').includes('fitness'));
      const onTopic = !topics.length || matchTopic;
      let s = Math.random() * 1.5;
      if (rules.preferFav && markOf(d.id).fav) s += 2;
      if (rules.preferUnused) {
        const u = usageOf(d.id);
        if (!u) s += 1.5;
        else if (u.last && daysBetween(u.last, ctx.date) < 21) s -= 3;
      }
      if (facetVals(d, 'u13').includes('yes')) s += 0.5;
      // Šuplíky v archivu nejsou dokonalé: téma uvedené jako první je hlavní, jinak jde často jen o vedlejší prvek
      if (topics.length && (topics.includes(facetVals(d, 'topics')[0]) || (hasFit && facetVals(d, 'part').includes('fitness')))) s += 2;
      if (posts.length && facetVals(d, 'posts').some(p => posts.includes(p))) s += 2.5;
      if (forms.length && forms.includes(facetVals(d, 'form')[0])) s += 2;
      if (spec.prog && (Number(d.durationMinutes) || 10) < 4) s -= 2;
      return { d, onTopic, s };
    })
    .sort((a, b) => (b.onTopic - a.onTopic) || (b.s - a.s));
}
function progKey(d) {
  const f = FORM_RANK[facetVals(d, 'form')[0]] ?? 2;
  const p = Math.min(9, ...facetVals(d, 'part').map(x => PART_RANK[x] ?? 2));
  return f * 10 + p;
}
function fillBlock(spec, minutes, topics, ctx) {
  const ranked = rankDrills(spec, topics, ctx);
  const items = [];
  let left = minutes;
  const take = (budget, pred) => {
    let b = Math.min(budget, left);
    for (const c of ranked) {
      if (b < 3) break;
      if (ctx.used.has(c.d.id) || (pred && !pred(c.d))) continue;
      if (pred && topics.length && !c.onTopic) continue; // ve fázích nácviku držet téma
      const dur = Number(c.d.durationMinutes) || 10;
      if (dur > b + 2) continue;
      const use = Math.min(dur, b);
      items.push({ drill: c.d, duration: use, notes: '' });
      ctx.used.add(c.d.id);
      b -= use; left -= use;
    }
  };
  if (spec.prog) STAGES.forEach(st => take(Math.round(minutes * st.share), st.ok));
  take(left);
  // Zbytek do 5 min přidat poslednímu cvičení, ať blok sedí na čas
  if (left > 0 && left <= 5 && items.length) items[items.length - 1].duration += left;
  if (spec.prog) items.sort((a, b) => progKey(a.drill) - progKey(b.drill));
  return items;
}

function generateTraining(o) {
  const tpl = tplById(o.tpl);
  if (!tpl) return;
  const sum = tpl.blocks.reduce((s, b) => s + (Number(b.minutes) || 0), 0) || 1;
  const themes = Array.isArray(o.themes) ? o.themes : (o.theme ? [o.theme] : []);
  const ctx = { themes, posts: o.posts || [], forms: o.forms || [], lastTheme: o.lastTheme, players: o.players, date: meta.date || todayStr(), used: new Set() };
  const nb = tpl.blocks.map(spec => ({
    id: uid(), name: spec.name,
    plannedMinutes: Math.max(5, Math.round((Number(spec.minutes) || 0) * o.minutes / sum)),
    items: [],
    gen: { parts: [...(spec.parts || [])], topic: spec.topic, topics: resolveTopics(spec, ctx), prog: !!spec.prog, forms: [...(spec.forms || [])] }
  }));
  // Bloky s tématem se plní první, ať dostanou nejlepší cvičení na téma
  [...nb].sort((a, b) => (a.gen.topics.length ? 0 : 1) - (b.gen.topics.length ? 0 : 1))
    .forEach(b => { b.items = fillBlock(b.gen, b.plannedMinutes, b.gen.topics, ctx); });
  blocks = nb;
  const usesLast = tpl.blocks.some(b => b.topic === 'last');
  const themeIds = usesLast && !tpl.blocks.some(b => b.topic === 'theme')
    ? (o.lastTheme ? [o.lastTheme] : themes)
    : themes;
  if (themeIds.length) meta.focus = themeIds.map(id => themeLbl(id)).join(', ');
  meta.target = o.minutes;
  meta.dirty = true;
  saveMeta();
  savePlan();
  swapSeen = {};
  halaIdx = 0;
}

// Pravidla pro blok, který vznikl ručně: podle názvu bloku a zaměření tréninku
function blockSpec(b) {
  if (b.gen) return b.gen;
  const part = guessPart(b.name);
  const themes = themesFromText(meta.focus);
  const useTheme = themes.length && part !== 'warmup' && part !== 'fitness';
  return { parts: part ? [part] : PART_ORDER.slice(), topic: useTheme ? 'theme' : 'any', topics: useTheme ? themes : [], prog: part === 'main' };
}
function regenBlock(id) {
  const b = blocks.find(x => x.id === id);
  if (!b) return;
  if (b.items.length && !confirm(`Nahradit cvičení v bloku „${b.name}“ novým výběrem?`)) return;
  const spec = blockSpec(b);
  const minutes = b.items.length ? blockDuration(b) : b.plannedMinutes;
  const used = new Set(blocks.filter(x => x !== b).flatMap(x => x.items.map(i => i.drill.id)));
  b.items.forEach(i => used.add(i.drill.id)); // ať se nabídne něco jiného než dosud
  const ctx = { players: rules.players, date: meta.date || todayStr(), used };
  let items = fillBlock(spec, minutes, spec.topics || [], ctx);
  if (!items.length) {
    b.items.forEach(i => used.delete(i.drill.id));
    items = fillBlock(spec, minutes, spec.topics || [], ctx);
  }
  if (!items.length) { toast('Pro tento blok není v archivu nic vhodného'); return; }
  b.items = items;
  b.plannedMinutes = minutes;
  savePlan();
  render();
  toast(`✨ Blok „${b.name}“ vygenerován`);
}

let swapSeen = {}; // blockId -> cvičení, která už se v bloku nabídla (ať se výměna netočí dokola)
function swapDrill(blockId, drillId, fromSheet) {
  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  const idx = b.items.findIndex(i => i.drill.id === drillId);
  if (idx < 0) return;
  const cur = b.items[idx];
  const spec = blockSpec(b);
  const seen = swapSeen[blockId] || (swapSeen[blockId] = new Set());
  seen.add(drillId);
  const inPlan = new Set(blocks.flatMap(x => x.items.map(i => i.drill.id)));
  const ctx = { players: rules.players, date: meta.date || todayStr(), used: new Set([...inPlan, ...seen]) };
  let ranked = rankDrills(spec, spec.topics || [], ctx);
  if (!ranked.length) {
    seen.clear(); seen.add(drillId);
    ctx.used = inPlan;
    ranked = rankDrills(spec, spec.topics || [], ctx);
  }
  // Podobná délka a forma jako původní cvičení, ať nerozbije čas ani postup nácviku
  const curForm = FORM_RANK[facetVals(cur.drill, 'form')[0]] ?? 2;
  const pick = ranked.map(c => ({ ...c,
      s2: c.s - Math.abs((Number(c.d.durationMinutes) || 10) - cur.duration) * 0.3
             - Math.abs((FORM_RANK[facetVals(c.d, 'form')[0]] ?? 2) - curForm) * (spec.prog ? 1.5 : 0) }))
    .sort((a, b) => (b.onTopic - a.onTopic) || (b.s2 - a.s2))[0];
  if (!pick) { toast('Jiné vhodné cvičení v archivu není'); return; }
  b.items[idx] = { drill: pick.d, duration: cur.duration, notes: '' };
  savePlan();
  if (fromSheet && sheet && sheet.mode === 'item') sheet.drillId = pick.d.id;
  render();
  toast(`↻ ${pick.d.title}`);
}

// ── Kontrola tréninku podle pravidel ───────────────────────────────────────
function trainingChecks() {
  const out = [];
  const all = blocks.flatMap(b => b.items);
  if (!all.length) return out;
  const total = blocks.reduce((s, b) => s + blockDuration(b), 0);
  if (meta.target && Math.abs(total - meta.target) > 5) out.push(`Trénink má ${total} min, plánováno je ${meta.target} min.`);
  if (!all.some(i => facetVals(i.drill, 'part').includes('game'))) out.push('Chybí herní forma (malá hra). Podle metodiky patří na konec tréninku.');
  const themes = themesFromText(meta.focus);
  blocks.forEach(b => {
    if (!b.items.length) { out.push(`Blok „${b.name}“ je prázdný.`); return; }
    if (b.gen && b.plannedMinutes - blockDuration(b) > 5) out.push(`Blok „${b.name}“: chybí ${b.plannedMinutes - blockDuration(b)} min, v archivu není dost vhodných cvičení.`);
    if (b.gen && b.gen.prog) {
      const keys = b.items.map(i => progKey(i.drill));
      if (keys.some((k, i) => i && k < keys[i - 1])) out.push(`Blok „${b.name}“ nejde od jednoduchého ke hře. Zkuste ✨ nebo přeřaďte cvičení.`);
    }
    if (themes.length && b.gen && (b.gen.topic === 'theme' || b.gen.topic === 'last')) {
      const off = b.items.filter(i => !facetVals(i.drill, 'topics').some(t => themes.includes(t)) && !(themes.includes('part:fitness') && facetVals(i.drill, 'part').includes('fitness'))).length;
      if (off) out.push(`Blok „${b.name}“: ${off}× cvičení mimo téma ${themes.map(t => themeLbl(t)).join(', ')}.`);
    }
  });
  const young = !['U15', 'U17', 'Dospělí'].includes(rules.category);
  const adapt = all.filter(i => facetVals(i.drill, 'u13').includes('adapt')).length;
  const unfit = all.filter(i => { const u = facetVals(i.drill, 'u13'); return u.length && !u.some(v => rules.fit.includes(v)); }).length;
  if (young && adapt && rules.fit.includes('adapt')) out.push(`${adapt}× cvičení označené „upravit“: projděte, jak ho zjednodušit.`);
  if (unfit) out.push(`${unfit}× cvičení neodpovídá kategorii ${rules.category}.`);
  return out;
}
function checkBox() {
  if (!rules.checks || !blocks.some(b => b.items.length)) return '';
  const list = trainingChecks();
  if (!list.length) return `<div class="check-box ok"><b>✓ Kontrola podle pravidel</b>Trénink odpovídá nastaveným pravidlům.</div>`;
  return `<div class="check-box"><b>⚠️ Kontrola podle pravidel</b><ul>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

// ── Okno Vygenerovat ───────────────────────────────────────────────────────
let genForm = null;
function chipH(label, on, onclick) { return `<span class="chip filter ${on ? 'on' : ''}" onclick="${onclick}">${esc(label)}</span>`; }
function openGen() {
  const date = meta.date || todayStr();
  const day = (rules.days || []).find(x => x.dow === dowOf(date));
  const tpl = tplById(day && day.tpl);
  const last = lastTheme(date);
  const focusThemes = themesFromText(meta.focus);
  genForm = {
    tpl: tpl ? tpl.id : '',
    minutes: Number(meta.target) || (day && day.minutes) || 90,
    // Bez zadaného zaměření pokračuje téma týdne z minulého tréninku (dá se změnit, lze vybrat i více)
    themes: focusThemes.length ? focusThemes : (last ? [last] : []),
    posts: [],
    forms: [],
    lastTheme: last,
    players: rules.players || 12,
    dayHint: day && tpl ? `${DOW[day.dow]}: podle nastavení „${tpl.name}“` : ''
  };
  sheet = { mode: 'gen' };
  history.pushState({ sheet: 1 }, '');
  renderGen();
  showSheet();
}
function setGen(k, v) { genForm[k] = v; renderGen(); }
function toggleGenArr(k, id) {
  const arr = genForm[k] || (genForm[k] = []);
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else arr.push(id);
  renderGen();
}
function renderGen() {
  const el = document.getElementById('sheet');
  const f = genForm;
  const tpl = tplById(f.tpl);
  if (!tpl) return;
  const sum = tpl.blocks.reduce((s, b) => s + (Number(b.minutes) || 0), 0) || 1;
  const usesLast = tpl.blocks.some(b => b.topic === 'last');
  const missing = EQUIP_GROUPS.filter(g => (rules.missingEquip || []).includes(g.id)).map(g => g.label);
  let h = `<div class="sheet-head">
      <button class="icon-btn" onclick="sheetBack()" title="Zpět">←</button>
      <div class="sheet-title">✨ Vygenerovat trénink<small>${esc(fmtDate(meta.date || todayStr()))} · vybírá z archivu podle vašich pravidel</small></div>
    </div>
    <div class="sheet-body" id="sheet-body">
      <div class="set-sec"><h3>Typ tréninku</h3>${f.dayHint ? `<div class="hint">${esc(f.dayHint)}</div>` : ''}
        <select style="width:100%" onchange="setGen('tpl', this.value)">${rules.templates.map(t => `<option value="${esc(t.id)}" ${t.id === tpl.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
        <div class="hint" style="margin:8px 0 0">${tpl.blocks.map(b => `${esc(b.name)} ${Math.max(5, Math.round((Number(b.minutes) || 0) * f.minutes / sum))} min`).join(' → ')}</div>
      </div>
      <div class="set-sec"><h3>Délka a hráči</h3>
        <div class="set-row">
          <span class="grow">Délka (min)</span><input type="number" min="20" max="240" step="5" value="${f.minutes}" onchange="setGen('minutes', +this.value || 90)" style="width:90px" />
        </div>
        <div class="set-row" style="margin-bottom:0">
          <span class="grow">Počet hráčů</span><input type="number" min="2" max="40" value="${f.players || ''}" onchange="setGen('players', +this.value || 0)" style="width:90px" />
        </div>
      </div>
      <div class="set-sec"><h3>Téma tréninku</h3>
        ${usesLast ? `<div class="hint">Hlavní část převezme téma minulého tréninku: <b>${f.lastTheme ? esc(facetLbl('topics', f.lastTheme)) : 'žádné nenalezeno, použije se téma níže'}</b></div>` : ''}
        <div class="hint">Můžete vybrat i více témat najednou (např. přihrávky a kondice).</div>
        <div class="chips" style="margin-top:0">${chipH('Bez tématu', !(f.themes && f.themes.length), `setGen('themes',[])`)}${topicOptions().map(o => chipH(o.short || o.label, (f.themes || []).includes(o.id), `toggleGenArr('themes','${o.id}')`)).join('')}${chipH('Kondice', (f.themes || []).includes('part:fitness'), `toggleGenArr('themes','part:fitness')`)}</div>
      </div>
      ${(facetDefOf('posts') || facetDefOf('form')) ? `<div class="set-sec"><h3>Upřesnit výběr (volitelné)</h3>
        ${facetDefOf('posts') ? `<div class="tb-lbl">Posty</div><div class="chips" style="margin-top:0">${facetDefOf('posts').options.filter(o => o.id !== 'all').map(o => chipH(o.short || o.label, (f.posts || []).includes(o.id), `toggleGenArr('posts','${o.id}')`)).join('')}</div>` : ''}
        ${facetDefOf('form') ? `<div class="tb-lbl">Forma</div><div class="chips" style="margin-top:0">${facetDefOf('form').options.map(o => chipH(o.short || o.label, (f.forms || []).includes(o.id), `toggleGenArr('forms','${o.id}')`)).join('')}</div>` : ''}
      </div>` : ''}
      <div class="hint" style="font-size:12px;color:var(--text2);margin:0 2px 12px">Kategorie ${esc(rules.category)} · ${missing.length ? 'bez pomůcek: ' + esc(missing.join(', ')) : 'všechny pomůcky'} ·
        <span style="color:#93c5fd;text-decoration:underline;cursor:pointer" onclick="openSettings(true)">upravit pravidla</span></div>
    </div>
    <div class="sheet-foot"><button class="btn btn-blue" onclick="runGen()">✨ Vygenerovat</button></div>`;
  el.dataset.view = 'gen';
  el.dataset.drill = '';
  el.innerHTML = h;
}
function runGen() {
  if (blocks.some(b => b.items.length) && !confirm('Nahradit současný obsah tréninku vygenerovaným?')) return;
  generateTraining(genForm);
  history.back();
  if (tab !== 'trenink') setTab('trenink'); else render();
  document.getElementById('main').scrollTop = 0;
  const n = rules.checks ? trainingChecks().length : 0;
  toast(n ? `✨ Vygenerováno · upozornění: ${n}` : '✨ Trénink vygenerován', 2500);
}

// ── Okno Nastavení tréninků ────────────────────────────────────────────────
let tplOpen = {};
function openSettings(replace) {
  if (replace && sheet) { sheet = { mode: 'settings' }; renderSettings(); return; }
  sheet = { mode: 'settings' };
  history.pushState({ sheet: 1 }, '');
  renderSettings();
  showSheet();
}
function checkRow(k, label, small) {
  return `<label class="set-check"><input type="checkbox" ${rules[k] ? 'checked' : ''} onchange="toggleRuleFlag('${k}')" /><span>${label}<small>${small}</small></span></label>`;
}
function renderSettings() {
  const el = document.getElementById('sheet');
  const prev = document.getElementById('sheet-body');
  const keep = prev && el.dataset.view === 'settings' ? prev.scrollTop : 0;
  const topics = topicOptions();
  const parts = (facetDefOf('part') || { options: [] }).options;
  const forms = (facetDefOf('form') || { options: [] }).options;
  let h = `<div class="sheet-head">
      <button class="icon-btn" onclick="sheetBack()" title="Zpět">←</button>
      <div class="sheet-title">⚙️ Nastavení tréninků<small>Platí v tomto telefonu · ukládá se samo</small></div>
      <button class="btn btn-blue" onclick="sheetBack()">Hotovo</button>
    </div>
    <div class="sheet-body" id="sheet-body">`;

  h += `<div class="set-sec"><h3>Kategorie</h3>
      <div class="hint">Podle kategorie se nabízí jen vhodná cvičení. V archivu jsou cvičení označená pro U13 jako „hodí se“, „upravit“ a „spíš pro starší“.</div>
      <div class="chips" style="margin-top:0">${CATS.map(c => chipH(c.id, rules.category === c.id, `setCategory('${c.id}')`)).join('')}</div>
      <div class="tb-lbl">Nabízet cvičení označená</div>
      <div class="chips" style="margin-top:0">${['yes', 'adapt', 'older'].map(v => chipH(facetLbl('u13', v), rules.fit.includes(v), `toggleFit('${v}')`)).join('')}</div>
    </div>`;

  h += `<div class="set-sec"><h3>Hráči a pomůcky</h3>
      <div class="set-row"><span class="grow">Obvykle chodí hráčů</span>
        <input type="number" min="2" max="40" value="${rules.players || ''}" onchange="setRulesPlayers(this.value)" style="width:80px" /></div>
      <div class="tb-lbl">Tyhle pomůcky nemáme (cvičení s nimi se nenabízí)</div>
      <div class="chips" style="margin-top:0">${EQUIP_GROUPS.map(g => { const on = (rules.missingEquip || []).includes(g.id); return chipH((on ? '🚫 ' : '') + g.label, on, `toggleMissingEquip('${g.id}')`); }).join('')}</div>
    </div>`;

  h += `<div class="set-sec"><h3>Tréninkové dny</h3>
      <div class="hint">Podle dne aplikace sama vybere typ tréninku, začátek a délku.</div>`;
  rules.days.forEach((d, i) => {
    h += `<div class="tb"><div class="set-row" style="margin-bottom:6px">
        <select onchange="setDay(${i},'dow',this.value)">${[1, 2, 3, 4, 5, 6, 0].map(n => `<option value="${n}" ${d.dow === n ? 'selected' : ''}>${DOW_SHORT[n]}</option>`).join('')}</select>
        <input type="time" value="${esc(d.time || '')}" onchange="setDay(${i},'time',this.value)" />
        <input type="number" min="20" max="240" step="5" value="${d.minutes || 90}" onchange="setDay(${i},'minutes',this.value)" style="width:70px" /><span style="font-size:12px;color:var(--text2)">min</span>
        <span class="grow"></span><button class="icon-btn del" onclick="removeDay(${i})" title="Smazat den">✕</button></div>
        <select style="width:100%" onchange="setDay(${i},'tpl',this.value)">${rules.templates.map(t => `<option value="${esc(t.id)}" ${t.id === d.tpl ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      </div>`;
  });
  h += `<button class="btn btn-surface btn-sm" onclick="addDay()">＋ Přidat den</button></div>`;

  h += `<div class="set-sec"><h3>Typy tréninku</h3>
      <div class="hint">Z jakých bloků se trénink skládá. Každý blok bere cvičení z vybraných částí archivu a drží zvolené téma.</div>`;
  rules.templates.forEach((t, i) => {
    const open = tplOpen[t.id];
    const sum = t.blocks.reduce((s, b) => s + (Number(b.minutes) || 0), 0);
    h += `<div class="tpl"><div class="tpl-head" onclick="toggleTpl('${jsStr(t.id)}')"><b>${esc(t.name)}</b><span>${t.blocks.length} bl. · ${sum} min ${open ? '▲' : '▼'}</span></div>`;
    if (open) {
      h += `<div class="tpl-body"><div class="tb-lbl">Název</div>
        <div class="set-row"><input class="grow" value="${esc(t.name)}" onchange="setTplName(${i}, this.value)" /></div>`;
      t.blocks.forEach((b, j) => {
        h += `<div class="tb">
          <div class="set-row" style="margin-bottom:0">
            <input class="grow" value="${esc(b.name)}" onchange="setTplBlock(${i},${j},'name',this.value)" />
            <input type="number" min="3" max="120" value="${b.minutes}" onchange="setTplBlock(${i},${j},'minutes',this.value)" style="width:62px" /><span style="font-size:12px;color:var(--text2)">min</span>
          </div>
          <div class="set-row" style="justify-content:flex-end;margin:2px 0 0">
            <button class="icon-btn" onclick="moveTplBlock(${i},${j},-1)" ${j === 0 ? 'disabled' : ''} title="Nahoru">↑</button>
            <button class="icon-btn" onclick="moveTplBlock(${i},${j},1)" ${j === t.blocks.length - 1 ? 'disabled' : ''} title="Dolů">↓</button>
            <button class="icon-btn del" onclick="removeTplBlock(${i},${j})" title="Smazat blok">✕</button>
          </div>
          <div class="tb-lbl">Bere cvičení z částí</div>
          <div class="chips">${parts.map(p => chipH(p.short || p.label, (b.parts || []).includes(p.id), `toggleTplPart(${i},${j},'${p.id}')`)).join('')}</div>
          <div class="tb-lbl">Téma</div>
          <select style="width:100%" onchange="setTplBlock(${i},${j},'topic',this.value)">${TOPIC_MODES.map(m => `<option value="${m.id}" ${b.topic === m.id ? 'selected' : ''}>${m.label}</option>`).join('')}</select>
          ${b.topic === 'fixed' ? `<div class="chips" style="margin-top:6px">${topics.map(o => chipH(o.short || o.label, (b.topics || []).includes(o.id), `toggleTplTopic(${i},${j},'${o.id}')`)).join('')}</div>` : ''}
          <div class="tb-lbl">Forma (nic vybraného = všechny)</div>
          <div class="chips">${forms.map(o => chipH(o.short || o.label, (b.forms || []).includes(o.id), `toggleTplForm(${i},${j},'${o.id}')`)).join('')}</div>
          <label class="set-check" style="border:none;padding-bottom:0"><input type="checkbox" ${b.prog ? 'checked' : ''} onchange="toggleTplProg(${i},${j})" />
            <span>Od jednoduchého ke hře<small>jednotlivě → dvojice → malé skupiny → celý tým</small></span></label>
        </div>`;
      });
      h += `<div class="set-row" style="margin-bottom:0">
          <button class="btn btn-surface btn-sm" onclick="addTplBlock(${i})">＋ Blok</button>
          <button class="btn btn-surface btn-sm" onclick="copyTemplate(${i})">📋 Kopie</button>
          <span class="grow"></span>
          <button class="btn btn-red btn-sm" onclick="removeTemplate(${i})">Smazat typ</button>
        </div></div>`;
    }
    h += `</div>`;
  });
  h += `<button class="btn btn-surface btn-sm" onclick="addTemplate()">＋ Nový typ tréninku</button></div>`;

  h += `<div class="set-sec"><h3>Pravidla výběru</h3>
      ${checkRow('preferFav', 'Přednost oblíbeným ★', 'Oblíbená cvičení se vybírají častěji')}
      ${checkRow('preferUnused', 'Přednost dlouho nepoužitým', 'Co bylo v uložených trénincích za poslední 3 týdny, se odsune')}
      ${checkRow('checks', 'Kontrola tréninku', 'Upozorní na chybějící hru, odbočení od tématu, postup od jednoduchého ke hře a délku')}
    </div>
    <div class="set-sec"><h3>Výchozí nastavení</h3>
      <div class="hint">Vrátí kategorii U13, dny Út / St / Čt a tři typy tréninku podle norské a dánské metodiky.</div>
      <button class="btn btn-red btn-sm" onclick="resetRules()">Obnovit výchozí</button>
    </div>
    </div>`;
  el.dataset.view = 'settings';
  el.dataset.drill = '';
  el.innerHTML = h;
  const body = document.getElementById('sheet-body');
  if (body && keep) body.scrollTop = keep;
}
// Textová pole se ukládají bez překreslení, aby se nezavírala klávesnice
function updRules(fn, rerender = true) { fn(); saveRules(); if (rerender) renderSettings(); }
function setCategory(id) { updRules(() => { rules.category = id; rules.fit = [...(CATS.find(c => c.id === id) || CATS[2]).fit]; }); }
function toggleFit(v) { updRules(() => { rules.fit = rules.fit.includes(v) ? rules.fit.filter(x => x !== v) : [...rules.fit, v]; if (!rules.fit.length) rules.fit = ['yes']; }); }
function setRulesPlayers(v) { updRules(() => { rules.players = parseInt(v) || 0; }, false); }
function toggleMissingEquip(g) { updRules(() => { const m = rules.missingEquip || []; rules.missingEquip = m.includes(g) ? m.filter(x => x !== g) : [...m, g]; }); }
function toggleRuleFlag(k) { updRules(() => { rules[k] = !rules[k]; }, false); }
function setDay(i, k, v) { updRules(() => { rules.days[i][k] = (k === 'dow' || k === 'minutes') ? (parseInt(v) || 0) : v; }, false); }
function addDay() { updRules(() => { rules.days.push({ dow: 1, time: '17:00', minutes: 90, tpl: (rules.templates[0] || {}).id || '' }); }); }
function removeDay(i) { updRules(() => { rules.days.splice(i, 1); }); }
function toggleTpl(id) { tplOpen[id] = !tplOpen[id]; renderSettings(); }
function setTplName(i, v) { updRules(() => { rules.templates[i].name = v.trim() || 'Bez názvu'; }, false); }
function setTplBlock(i, j, k, v) { updRules(() => { rules.templates[i].blocks[j][k] = k === 'minutes' ? (parseInt(v) || 5) : v; }, k === 'topic'); }
function toggleTplPart(i, j, p) { updRules(() => { const b = rules.templates[i].blocks[j]; b.parts = (b.parts || []).includes(p) ? b.parts.filter(x => x !== p) : [...(b.parts || []), p]; }); }
function toggleTplTopic(i, j, t) { updRules(() => { const b = rules.templates[i].blocks[j]; b.topics = (b.topics || []).includes(t) ? b.topics.filter(x => x !== t) : [...(b.topics || []), t]; }); }
function toggleTplForm(i, j, f) { updRules(() => { const b = rules.templates[i].blocks[j]; b.forms = (b.forms || []).includes(f) ? b.forms.filter(x => x !== f) : [...(b.forms || []), f]; }); }
function toggleTplProg(i, j) { updRules(() => { const b = rules.templates[i].blocks[j]; b.prog = !b.prog; }, false); }
function addTplBlock(i) { updRules(() => { rules.templates[i].blocks.push(tb('Nový blok', 10, ['main'], 'theme')); }); }
function removeTplBlock(i, j) {
  if (rules.templates[i].blocks.length <= 1) { toast('Typ tréninku musí mít aspoň jeden blok'); return; }
  updRules(() => { rules.templates[i].blocks.splice(j, 1); });
}
function moveTplBlock(i, j, dir) {
  const bl = rules.templates[i].blocks;
  const k = j + dir;
  if (k < 0 || k >= bl.length) return;
  updRules(() => { [bl[j], bl[k]] = [bl[k], bl[j]]; });
}
function addTemplate() {
  const id = 'tpl-' + Date.now();
  tplOpen[id] = true;
  updRules(() => { rules.templates.push({ id, name: 'Nový typ tréninku', blocks: [
    tb('Rozcvička', 20, ['warmup'], 'any'), tb('Hlavní část', 50, ['technique', 'main'], 'theme', [], true), tb('Hra', 20, ['game'], 'theme')] }); });
}
function copyTemplate(i) {
  const id = 'tpl-' + Date.now();
  tplOpen[id] = true;
  updRules(() => { const c = JSON.parse(JSON.stringify(rules.templates[i])); c.id = id; c.name += ' (kopie)'; rules.templates.splice(i + 1, 0, c); });
}
function removeTemplate(i) {
  if (rules.templates.length <= 1) { toast('Aspoň jeden typ tréninku musí zůstat'); return; }
  const t = rules.templates[i];
  if (!confirm(`Smazat typ tréninku „${t.name}“?`)) return;
  updRules(() => { rules.templates.splice(i, 1); rules.days.forEach(d => { if (d.tpl === t.id) d.tpl = rules.templates[0].id; }); });
}
function resetRules() {
  if (!confirm('Vrátit všechna nastavení tréninků na výchozí (U13, Út / St / Čt)?')) return;
  updRules(() => { rules = defaultRules(); });
}

// ── Tisk a text pro XPS ────────────────────────────────────────────────────
function trainingTitle() { return (meta.name || '').trim() || defaultName(); }
function dowCap(s) { if (!s) return ''; const d = DOW[dowOf(s)]; return d.charAt(0).toUpperCase() + d.slice(1); }
function openExport() {
  if (!blocks.some(b => b.items.length)) { toast('Trénink je zatím prázdný'); return; }
  sheet = { mode: 'export' };
  history.pushState({ sheet: 1 }, '');
  renderExport();
  showSheet();
}
function renderExport() {
  const el = document.getElementById('sheet');
  el.dataset.view = 'export';
  el.dataset.drill = '';
  el.innerHTML = `<div class="sheet-head">
      <button class="icon-btn" onclick="sheetBack()" title="Zpět">←</button>
      <div class="sheet-title">🖨️ Tisk a export<small>${esc(trainingTitle())}</small></div>
    </div>
    <div class="sheet-body" id="sheet-body">
      <button class="btn btn-surface exp-btn" onclick="printPlan(false)"><span>🖨️ Tisk – stručně<small>Časy, cvičení a organizace na 1 A4</small></span></button>
      <button class="btn btn-surface exp-btn" onclick="printPlan(true)"><span>🖨️ Tisk – podrobně<small>Celý popis každého cvičení, víc stran</small></span></button>
      <div class="hint" style="font-size:12px;color:var(--text2);margin:-2px 2px 12px">V telefonu se otevře tisk: vyberte tiskárnu, nebo „Uložit jako PDF“.</div>
      <button class="btn btn-blue exp-btn" onclick="copyXps()"><span>📋 Kopírovat pro XPS<small style="color:#dbeafe">Vložte do XPS, nebo text pošlete Claudovi k zápisu</small></span></button>
      <div class="section-h">Náhled textu pro XPS</div>
      <div class="gen-preview">${esc(xpsText())}</div>
      <button class="btn btn-surface exp-btn" style="margin-top:12px" onclick="sharePlanText()"><span>📤 Poslat jako text<small>WhatsApp, e-mail…</small></span></button>
    </div>`;
}
// Formát podle dovednosti „zápis tréninku do XPS“: téma, pak jeden řádek na blok s odrážkami •
function xpsText() {
  const total = blocks.reduce((s, b) => s + blockDuration(b), 0);
  const lines = [`Téma tréninku: ${(meta.focus || '').trim() || '(doplňte)'}`];
  lines.push([meta.date ? `${dowCap(meta.date)} ${fmtDate(meta.date)}` : '', meta.time || '', `${total} min`, rules.category].filter(Boolean).join(' · '));
  lines.push('');
  blocks.forEach(b => {
    if (!b.items.length) return;
    lines.push(`${b.name} (${blockDuration(b)} min) • ` + b.items.map(it =>
      `${it.drill.title} (${it.duration} min)${(it.notes || '').trim() ? ' – ' + it.notes.trim() : ''}`).join(' • '));
  });
  return lines.join('\n');
}
async function copyXps() {
  const text = xpsText();
  try { await navigator.clipboard.writeText(text); toast('📋 Zkopírováno. Vložte do XPS, nebo pošlete Claudovi.', 3000); }
  catch (_) { prompt('Zkopírujte text pro XPS:', text); }
}
function shortText(s, n) {
  s = String(s || '').trim();
  if (s.length <= n) return s;
  const cut = s.slice(0, n);
  const dot = cut.lastIndexOf('. ');
  return dot > n * 0.5 ? cut.slice(0, dot + 1) : cut.replace(/\s+\S*$/, '') + '…';
}
function printPlan(detail) {
  document.getElementById('print-area').innerHTML = printHtml(detail);
  setTimeout(() => window.print(), 80);
}
function printHtml(detail) {
  const total = blocks.reduce((s, b) => s + blockDuration(b), 0);
  const clock = m => meta.time ? endTime(meta.time, m) : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  const eq = equipList(blocks);
  const sub = [meta.date ? `${dowCap(meta.date)} ${fmtDate(meta.date)}` : '', meta.time ? `${meta.time}–${endTime(meta.time, total)}` : '',
    `${total} min`, rules.category, (meta.focus || '').trim() ? 'Téma: ' + meta.focus.trim() : ''].filter(Boolean).join(' · ');
  let h = `<h1>${esc(trainingTitle())}</h1><div class="pr-sub">${esc(sub)}</div>`;
  if (eq.length) h += `<div class="pr-eq"><b>Pomůcky:</b> ${eq.map(esc).join(', ')}</div>`;
  let t = 0;
  if (!detail) {
    h += `<table><thead><tr><th>Čas</th><th>Cvičení</th><th>Min</th><th>Organizace / poznámka</th></tr></thead><tbody>`;
    blocks.forEach(b => {
      const bd = blockDuration(b);
      h += `<tr class="pr-block"><td class="pr-time">${clock(t)}</td><td colspan="3">${esc(b.name)} (${bd} min)</td></tr>`;
      let tt = t;
      b.items.forEach(it => {
        const org = shortText(it.drill.organization || it.drill.objective, 170);
        h += `<tr><td class="pr-time">${clock(tt)}</td><td><b>${esc(it.drill.title)}</b></td><td class="pr-min">${it.duration}</td>
          <td>${esc(org)}${(it.notes || '').trim() ? `<div class="pr-note">Pozn.: ${esc(it.notes.trim())}</div>` : ''}</td></tr>`;
        tt += it.duration;
      });
      t += bd;
    });
    h += `</tbody></table>`;
    return h;
  }
  const list = (arr, lbl, ord) => arr && arr.length
    ? `<div class="pr-lbl">${lbl}</div><${ord ? 'ol' : 'ul'}>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</${ord ? 'ol' : 'ul'}>` : '';
  blocks.forEach(b => {
    const bd = blockDuration(b);
    h += `<h2>${clock(t)} · ${esc(b.name)} (${bd} min)</h2>`;
    let tt = t;
    b.items.forEach(it => {
      const d = it.drill;
      h += `<div class="pr-drill"><h3>${clock(tt)} · ${esc(d.title)} (${it.duration} min)</h3>`;
      if ((it.notes || '').trim()) h += `<div class="pr-note">Pozn.: ${esc(it.notes.trim())}</div>`;
      if (d.objective) h += `<div><b>Cíl:</b> ${esc(d.objective)}</div>`;
      if (d.organization) h += `<div><b>Organizace:</b> ${esc(d.organization)}</div>`;
      h += list(d.execution, 'Průběh', true) + list(d.coachingPoints, 'Klíčové pokyny') + list(d.commonMistakes, 'Časté chyby') + list(d.progressions, 'Varianty');
      const m = [d.playerCount, d.courtZone, ...(d.equipment || [])].filter(Boolean);
      if (m.length) h += `<div class="pr-meta">${m.map(esc).join(' · ')}</div>`;
      h += `</div>`;
      tt += it.duration;
    });
    t += bd;
  });
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════
// Pomocné
// ═══════════════════════════════════════════════════════════════════════════
function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
// Text vložený do onclick='…' uvnitř atributu v uvozovkách
function jsStr(s) { return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
const jsId = jsStr;

let toastTimer = null;
function toast(msg, ms = 2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

</script>
</body>
</html>
